<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Apex · Today</title>
<style>
  :root{--bg:#f7f6f2;--card:#fbf9f4;--ink:#2b2a26;--muted:#8c8474;--line:#e7e2d6;--accent:#a9741f;--chip:#f3efe4;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:28px;min-height:100vh;}
  .wrap{max-width:1080px;margin:0 auto;}
  .brand{font-size:15px;font-weight:700;margin-bottom:10px}
  .nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .nav a{text-decoration:none;font-size:13px;color:var(--muted);background:var(--surface,#fff);padding:7px 14px;border-radius:8px;border:1px solid var(--line)}
  .nav a.active{background:var(--chip);border-color:var(--accent);color:var(--accent)}
  a{color:var(--accent)}
  .hello{display:flex;align-items:flex-end;gap:14px;margin:4px 0 18px;flex-wrap:wrap}
  .hello h1{font-size:28px;margin:0;letter-spacing:-.4px}
  .hello .date{color:var(--muted);font-size:14px;padding-bottom:4px}
  .hello .sp{flex:1}
  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:16px}
  .card{background:var(--surface,#fff);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,22,35,.05)}
  .card h2{margin:0 0 10px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
  .card h2 a{margin-left:auto;font-size:11px;font-weight:600;text-decoration:none;letter-spacing:0;text-transform:none}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  /* brief */
  .brief h2:not(:first-child){font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .brief h3{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  .brief ul{margin:0;padding-left:18px}
  .brief li{margin:3px 0;font-size:14px;line-height:1.45}
  .brief p{margin:6px 0;font-size:14px;line-height:1.45}
  .brief .brief-edit{outline:none;border-radius:8px;padding:2px 4px;margin:-2px -4px}
  .brief .brief-edit:focus{background:var(--chip)}
  .brief .brief-edit > h2:first-child{display:none}
  /* events */
  .ev{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
  .ev:first-of-type{border-top:0}
  .ev .t{width:92px;flex-shrink:0;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;padding-top:2px}
  .ev .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
  .ev .n{flex:1}
  .ev .n small{display:block;color:var(--muted);font-size:12px}
  .ev.past{opacity:.5}
  .ev.now .n{font-weight:600}
  .ev a.join{font-size:12px;text-decoration:none;background:var(--chip);padding:2px 8px;border-radius:999px;white-space:nowrap}
  /* tasks */
  .task{display:flex;align-items:flex-start;gap:10px;padding:6px 0;font-size:14px}
  .task .chk{width:18px;height:18px;border-radius:50%;border:1.6px solid #c9c2b2;flex-shrink:0;margin-top:1px;cursor:pointer;background:var(--surface,#fff)}
  .task .chk:hover{border-color:var(--accent)}
  .task .tx{flex:1}
  .task .due{font-size:11px;color:#9b2b22;background:#fbe9e7;padding:1px 7px;border-radius:999px;margin-left:6px}
  .task .due.today{color:#7a5200;background:#fff1d6}
  .task .lst{font-size:11px;color:var(--muted)}
  /* habits */
  .hab{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
  .hab .chk{width:18px;height:18px;border-radius:5px;border:1.6px solid #c9c2b2;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--surface,#fff)}
  .hab .chk.on{background:#16a34a;border-color:#16a34a}
  .hab .chk.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px)}
  .hab .st{margin-left:auto;font-size:12px;color:var(--muted)}
  /* time */
  .tbar{height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--chip);margin:8px 0 6px}
  .tbar i{display:block;height:100%}
  .tl{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
  .tl b{color:var(--ink)}
  .big{font-size:26px;font-weight:700;letter-spacing:-.4px}
  .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
  .now-slot{font-size:13px;margin-top:6px}
  .wkline{font-size:12px;color:var(--muted);margin-top:4px} .wkline b{color:var(--ink)}
  .wkbar{height:5px;border-radius:3px;background:var(--chip);margin-top:5px;overflow:hidden} .wkbar i{display:block;height:100%;background:#a9741f;border-radius:3px}
  .slots{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  .slots .lbl{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between}
  .slots .lbl a{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500;text-decoration:none}
  .slot{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .slot .t{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:88px;flex-shrink:0}
  .slot input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font:inherit;font-size:13px;background:var(--surface,#fff);color:var(--ink);outline:none;border-left-width:4px}
  .slot input:focus{border-color:var(--accent)}
  .slot.now input{box-shadow:0 0 0 2px rgba(169,116,31,.18)}
  .slot.now .t{color:#a9741f;font-weight:600}
  /* card layout: drag a card's heading to move it within or across the two columns */
  .card h2[draggable]{cursor:grab;user-select:none}
  .card h2[draggable]:active{cursor:grabbing}
  .card.dragging{opacity:.35}
  .card.drop-before{box-shadow:0 -3px 0 0 var(--accent),0 1px 3px rgba(20,22,35,.05)}
  .card.drop-after{box-shadow:0 3px 0 0 var(--accent),0 1px 3px rgba(20,22,35,.05)}
  .col.drop-end{outline:2px dashed var(--accent);outline-offset:6px;border-radius:14px;min-height:60px}
  .layout-foot{text-align:right;margin-top:10px}
  .layout-foot button{font:inherit;font-size:11.5px;color:var(--muted);background:transparent;border:0;cursor:pointer;text-decoration:underline dotted}
  .layout-foot button:hover{color:var(--accent)}
  .qa{display:flex;gap:8px;flex-wrap:wrap}
  .qa a,.qa button{text-decoration:none;font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
  .qa a:hover,.qa button:hover{border-color:var(--accent);color:var(--accent)}
  @media (max-width:700px){ body{padding:14px} .hello h1{font-size:22px} }
</style>

<div class="wrap">

  <div class="hello"><h1 id="greet"></h1><span class="date" id="date"></span><span class="sp"></span>

  <div class="grid" id="grid">

      <div class="card" data-card="brief"><h2 draggable="true" title="Drag to move this card">Executive summary <a href="notes.html">Open in Notes →</a></h2><div class="brief" id="brief"></div></div>

      <div class="card" data-card="habits"><h2 draggable="true" title="Drag to move this card">Habits <a href="index.html">Habits →</a></h2><div id="habits"></div></div>

<script>
const $=id=>document.getElementById(id);
const ls=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const pad=n=>String(n).padStart(2,'0');
const isoDay=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date(), today=isoDay(now);

/* card layout — drag a heading to arrange the cards; saved as apexTodayLayout {a:[ids], b:[ids]} */
(function(){
  const KEY='apexTodayLayout', grid=$('grid'), cols={a:grid.querySelector('[data-col=a]'),b:grid.querySelector('[data-col=b]')};
  const cardEl=id=>grid.querySelector('.card[data-card="'+id+'"]');
  const current=()=>({a:[...cols.a.querySelectorAll('.card')].map(c=>c.dataset.card), b:[...cols.b.querySelectorAll('.card')].map(c=>c.dataset.card)});
  const DEFAULT=current();
  function apply(L){ if(!L||!L.a||!L.b) return; const seen=new Set(); ['a','b'].forEach(k=>L[k].forEach(id=>{ const el=cardEl(id); if(el&&!seen.has(id)){ cols[k].appendChild(el); seen.add(id); } }));
    // any card unknown to the saved layout keeps its default column, at the bottom
    ['a','b'].forEach(k=>DEFAULT[k].forEach(id=>{ if(!seen.has(id)){ cols[k].appendChild(cardEl(id)); seen.add(id); } })); }
  function save(){ const L=current(); const same=JSON.stringify(L)===JSON.stringify(DEFAULT); if(same) localStorage.removeItem(KEY); else localStorage.setItem(KEY,JSON.stringify(L)); $('layoutReset').hidden=same; }
  const saved=ls(KEY,null); if(saved){ apply(saved); $('layoutReset').hidden=false; }
  $('layoutReset').addEventListener('click',()=>{ apply(DEFAULT); save(); });
  let drag=null;
  grid.addEventListener('dragstart',e=>{ const h=e.target.closest&&e.target.closest('h2[draggable]'); if(!h) return; drag=h.closest('.card'); drag.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',drag.dataset.card); }catch(x){} });
  const clear=()=>grid.querySelectorAll('.drop-before,.drop-after,.drop-end').forEach(x=>x.classList.remove('drop-before','drop-after','drop-end'));
  grid.addEventListener('dragover',e=>{ if(!drag) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; clear();
    const over=e.target.closest('.card'); const col=e.target.closest('.col');
    if(over&&over!==drag){ const r=over.getBoundingClientRect(); over.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after'); }
    else if(col&&!over){ col.classList.add('drop-end'); } });
  grid.addEventListener('dragleave',e=>{ if(!grid.contains(e.relatedTarget)) clear(); });
  grid.addEventListener('drop',e=>{ if(!drag) return; e.preventDefault();
    const over=e.target.closest('.card'); const col=e.target.closest('.col');
    if(over&&over!==drag){ const r=over.getBoundingClientRect(); over.parentNode.insertBefore(drag, e.clientY<r.top+r.height/2?over:over.nextSibling); }
    else if(col){ col.appendChild(drag); }
    clear(); save(); });
  grid.addEventListener('dragend',()=>{ if(drag) drag.classList.remove('dragging'); drag=null; clear(); });
})();

/* greeting */
(function(){ const h=now.getHours(); const g=h<5?'Still up':h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  $('greet').textContent=g+', Wiktor'; $('date').textContent=now.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}); })();

/* executive summary — from the Notes store; if today's isn't there yet, fetch it from the calendar carrier event and file it into the note */
async function fetchBriefFromCalendar(){
  try{ const tok=JSON.parse(localStorage.getItem('apexGTok')||'null'); if(!tok||!tok.t||tok.e<Date.now()) return null;
    const min=new Date(); min.setDate(min.getDate()-7); min.setHours(0,0,0,0);
    const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=50&q='+encodeURIComponent('Executive summary')+'&timeMin='+encodeURIComponent(min.toISOString()),{headers:{Authorization:'Bearer '+tok.t}});
    if(!r.ok) return null; const j=await r.json(); const evs=(j.items||[]).filter(e=>e.status!=='cancelled'&&/^executive summary/i.test(e.summary||'')&&e.start&&e.start.date&&e.description).sort((a,c)=>a.start.date<c.start.date?1:-1);
    return evs[0]?{date:evs[0].start.date,html:evs[0].description}:null; }catch(e){ return null; }
}
(async function(){
  let S=ls('wiktorNotes',null); let n=S&&S.notes&&S.notes.find(x=>(x.title||'').trim().toLowerCase()==='executive summary');
  let m=n&&(n.body||'').match(/<div class="brief" data-brief="([^"]*)">([\s\S]*?)<\/div><hr class="brief-end">/);
  if(!m||m[1]!==today){ const b=await fetchBriefFromCalendar(); if(b&&(!m||b.date>m[1])){ S=S||{notes:[]}; S.notes=S.notes||[];
      if(!n){ n={id:Math.random().toString(36).slice(2,9),title:'Executive summary',pinned:true,created:Date.now(),updated:Date.now(),body:''}; S.notes.unshift(n); }
      const cur=n.body||''; const rest=cur.replace(/<div class="brief" data-brief="[^"]*">[\s\S]*?<\/div><hr class="brief-end">/,'').replace(/^(<div><br><\/div>)+/,'');
      n.body='<div class="brief" data-brief="'+b.date+'">'+b.html+'</div><hr class="brief-end">'+rest; n.updated=Date.now(); n.pinned=true; localStorage.setItem('wiktorNotes',JSON.stringify(S));
      m=n.body.match(/<div class="brief" data-brief="([^"]*)">([\s\S]*?)<\/div><hr class="brief-end">/); } }
  if(!m){ $('brief').innerHTML='<div class="empty">No summary yet — it lands here every morning at 07:30.</div>'; return; }
  const fresh = m[1]===today;
  $('brief').innerHTML=(fresh?'':'<div class="empty" style="padding:0 0 6px" contenteditable="false">From '+esc(m[1])+' — today’s hasn’t arrived yet.</div>')+'<div class="brief-edit" contenteditable="true" spellcheck="true">'+m[2].replace(/<script[\s\S]*?<\/script>/gi,'')+'</div>';
  // edits here flow straight back into the note (debounced)
  const ed=$('brief').querySelector('.brief-edit'); let t0=null;
  ed.addEventListener('input',()=>{ clearTimeout(t0); t0=setTimeout(()=>{ const S2=ls('wiktorNotes',null); const n2=S2&&S2.notes&&S2.notes.find(x=>x.id===n.id); if(!n2) return;
    n2.body=(n2.body||'').replace(/(<div class="brief" data-brief="[^"]*">)[\s\S]*?(<\/div><hr class="brief-end">)/, (_,a,b)=>a+ed.innerHTML+b); n2.updated=Date.now(); localStorage.setItem('wiktorNotes',JSON.stringify(S2)); },500); });
})();

/* tasks — overdue + due today, then a couple of next-up */
(function(){
  const st=ls('apexTasks',null); if(!st||!st.taskLists){ $('tasks').innerHTML='<div class="empty">No tasks yet.</div>'; return; }
  const rows=[];
  st.taskLists.forEach(l=>(l.items||[]).forEach(it=>{ if(it.done) return; rows.push({it,l}); }));
  const dated=rows.filter(r=>r.it.due&&r.it.due<=today).sort((a,b)=>a.it.due<b.it.due?-1:a.it.due>b.it.due?1:0);
  const soon=rows.filter(r=>r.it.due&&r.it.due>today).sort((a,b)=>a.it.due<b.it.due?-1:1).slice(0,3);
  const undated=rows.filter(r=>!r.it.due).slice(0,3);
  const list=dated.concat(soon.length?soon:undated);
  if(!list.length){ $('tasks').innerHTML='<div class="empty">Nothing due. Nice.</div>'; return; }
  $('tasks').innerHTML=list.map(r=>{ const d=r.it.due; const tag=!d?'':d<today?'<span class="due">overdue</span>':d===today?'<span class="due today">today</span>':'<span class="due today" style="background:var(--chip);color:var(--muted)">'+esc(new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric'}))+'</span>';
    return '<div class="task"><div class="chk" role="checkbox" aria-checked="false" tabindex="0" data-l="'+esc(r.l.id)+'" data-i="'+esc(r.it.id)+'" title="Mark done"></div><div class="tx">'+esc(r.it.text)+tag+'<div class="lst">'+esc(r.l.name)+'</div></div></div>'; }).join('');
  $('tasks').addEventListener('click',e=>{ const c=e.target.closest('.chk'); if(!c) return;
    const s=ls('apexTasks',null); const l=s.taskLists.find(x=>x.id===c.dataset.l); const it=l&&l.items.find(x=>x.id===c.dataset.i); if(!it) return;
    it.done=true; it.doneAt=Date.now(); localStorage.setItem('apexTasks',JSON.stringify(s)); c.closest('.task').style.opacity='.35'; c.style.background='#16a34a'; c.style.borderColor='#16a34a'; });
})();

/* calendar — cached week from the Calendar tab, refreshed live when its token is still valid */
(async function(){
  const el=$('cal');
  const cache=ls('apexCal',{events:{},calendars:[]}); const prefs=ls('apexCalPrefs',{hidden:{}});
  // only your own calendars: the primary one plus calendars that aren't another person's account,
  // and nothing you've hidden in the Calendar tab
  const mine=c=>!(prefs.hidden&&prefs.hidden[c.id]) && (c.primary || !(/@/.test(c.id) && !/group\.calendar\.google\.com$|holiday|import\.calendar/.test(c.id)));
  const myCals=(cache.calendars||[]).filter(mine); const myIds=new Set(myCals.map(c=>c.id));
  const paint=evs=>{
    const list=evs.filter(e=>!/^executive summary/i.test(e.title||'') && (!e.calId||myIds.has(e.calId)) && (isoDay(new Date(e.start))===today || (e.allDay && new Date(e.start)<=now && new Date(e.end)>now))).sort((a,b)=>new Date(a.start)-new Date(b.start));
    if(!list.length){ el.innerHTML='<div class="empty">Nothing on the calendar today.</div>'; return; }
    el.innerHTML=list.map(e=>{ const s=new Date(e.start), en=new Date(e.end); const past=en<now, cur=s<=now&&en>now;
      return '<div class="ev'+(past?' past':cur?' now':'')+'"><span class="t">'+(e.allDay?'All day':s.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})+'–'+en.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}))+'</span><span class="dot" style="background:'+esc(e.color||'#a9741f')+'"></span><span class="n">'+esc(e.title)+(e.location?'<small>'+esc(e.location)+'</small>':'')+'</span>'+(e.meet?'<a class="join" href="'+esc(e.meet)+'" target="_blank" rel="noopener">Join</a>':'')+'</div>'; }).join('');
  };
  let shown=false;
  for(const k in cache.events){ const [a,b]=k.split('_'); if(a<=today&&today<b){ paint(cache.events[k]); shown=true; break; } }
  if(!shown) el.innerHTML='<div class="empty">Open the Calendar tab once to connect Google Calendar.</div>';
  // live refresh with the calendar tab's token (same browser)
  const tok=ls('apexGTok',null); if(!tok||tok.e<Date.now()||!myCals.length) return;
  try{
    const s=new Date(now.getFullYear(),now.getMonth(),now.getDate()), e=new Date(s); e.setDate(e.getDate()+1);
    const out=[];
    await Promise.all(myCals.map(async c=>{ const q='?singleEvents=true&orderBy=startTime&maxResults=50&timeMin='+encodeURIComponent(s.toISOString())+'&timeMax='+encodeURIComponent(e.toISOString());
      const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(c.id)+'/events'+q,{headers:{Authorization:'Bearer '+tok.t}}); if(!r.ok) return; const j=await r.json();
      (j.items||[]).forEach(ev=>{ if(ev.status==='cancelled') return; const allDay=!!(ev.start&&ev.start.date);
        out.push({calId:c.id,title:ev.summary||'(no title)',allDay,start:allDay?ev.start.date+'T00:00':ev.start.dateTime,end:allDay?ev.end.date+'T00:00':ev.end.dateTime,color:c.color,location:ev.location||'',meet:ev.hangoutLink||''}); }); }));
    paint(out);
  }catch(err){}
})();

/* right now — time log for today (read-only view of apexTime; nothing is written unless you type) */
(async function(){
  const S=ls('apexTime',{weeks:{}}); const START=300, STEP=30;
  const m=new Date(now); const dow=(m.getDay()+6)%7; m.setDate(m.getDate()-dow); const wk=S.weeks[isoDay(m)]||{};
  const CATS={}; (window.ApexTime?window.ApexTime.CATS:[]).forEach(c=>CATS[c.id]=[c.name,c.color]); const LEG=(window.ApexTime&&window.ApexTime.LEGACY)||{};
  const per={}; let logged=0, slept=0; for(const k in wk){ if(k.startsWith('wake')||k.startsWith('night')) continue; const [d,r]=k.split('_'); if(+d!==dow||!wk[k]||!wk[k].t) continue; let c=wk[k].c||'other'; if(LEG[c]) c=LEG[c]; logged+=.5; if(c==='sleep'){ slept+=.5; continue; } per[c]=(per[c]||0)+.5; }
  // the night hours the 05:00–23:00 sheet can't hold, from the 🌙–☀ times on the Time tab
  const nInfo=window.ApexTime&&window.ApexTime.nightOf?window.ApexTime.nightOf(wk,dow):null;
  if(nInfo&&nInfo.offGrid>0){ logged+=nInfo.offGrid; slept+=nInfo.offGrid; }
  const mins=now.getHours()*60+now.getMinutes(); const r=Math.floor((mins-START)/STEP); const cur=wk[dow+'_'+r];
  const slot=n=>pad(Math.floor(n/60))+':'+pad(n%60);
  // week so far: how much of the elapsed time (05:00–23:00 each day, up to now) is filled in
  const elapsed=dow*36+Math.max(0,Math.min(36,r+1)); let wkFilled=0, wkLogged=0;
  for(const k in wk){ if(k.startsWith('wake')||k.startsWith('night')||!wk[k]||!wk[k].t) continue; const [d,rr]=k.split('_').map(Number); wkLogged+=.5; if(d<dow||(d===dow&&rr<=r)) wkFilled++; }
  const pct=elapsed?Math.min(100,Math.round(wkFilled/elapsed*100)):0;
  if(window.ApexTime&&window.ApexTime.nightOf){ for(let dd=0;dd<7;dd++){ const nn=window.ApexTime.nightOf(wk,dd); if(nn&&nn.offGrid>0) wkLogged+=nn.offGrid; } }
  let h='<div class="big">'+(Math.round(logged*10)/10)+' h<small>logged today'+(slept?' · incl. '+(Math.round(slept*10)/10)+' h sleep':'')+'</small></div>'+
    '<div class="wkline"><span>This week: <b>'+(Math.round(wkLogged*10)/10)+' h</b> logged · <b>'+pct+'%</b> of the time so far filled in</span><div class="wkbar"><i style="width:'+pct+'%"></i></div></div>';
  const awake=logged-slept; if(awake>0){ h+='<div class="tbar">'+Object.keys(per).map(c=>'<i style="width:'+(per[c]/awake*100)+'%;background:'+(CATS[c]?CATS[c][1]:'#cfc8b8')+'"></i>').join('')+'</div><div class="tl">'+Object.keys(per).sort((a,b)=>per[b]-per[a]).map(c=>'<span><b>'+(Math.round(per[c]*10)/10)+'h</b> '+(CATS[c]?CATS[c][0]:'Other')+'</span>').join('')+'</div>'; }
  // the last 90 minutes (3 half-hour slots, current one last) so the recent past can be filled in right here
  const rows=[]; for(let rr=Math.max(0,r-2); rr<=Math.min(35,r); rr++) rows.push(rr);
  const colOf=c=>{ if(LEG[c]) c=LEG[c]; return CATS[c]?CATS[c][1]:'var(--line)'; };
  if(rows.length){ h+='<div class="slots"><div class="lbl"><span>Last 90 minutes</span><a href="time.html">Full week →</a></div>'+rows.map(rr=>{ const v=wk[dow+'_'+rr]; return '<div class="slot'+(rr===r?' now':'')+'"><span class="t">'+slot(START+rr*STEP)+' – '+slot(START+rr*STEP+STEP)+'</span><input data-r="'+rr+'" placeholder="'+(rr===r?'What are you doing now?':'…')+'" value="'+esc(v&&v.t||'')+'" style="border-left-color:'+(v&&v.t?colOf(v.c||'other'):'var(--line)')+'"></div>'; }).join('')+'</div>'; }
  $('time').innerHTML=h;
  const write=inp=>{ const rr=+inp.dataset.r; const S2=ls('apexTime',{weeks:{},rules:{}}); S2.weeks=S2.weeks||{}; const w=S2.weeks[isoDay(m)]||(S2.weeks[isoDay(m)]={}); const t=inp.value.trim(); const k=dow+'_'+rr;
    if(t){ const prev=w[k]||{}; w[k]={t}; const c=(prev.t===t&&prev.c)?prev.c:(window.ApexTime?window.ApexTime.guessCat(t,S2.rules||{}):null); if(c) w[k].c=c; } else delete w[k];
    localStorage.setItem('apexTime',JSON.stringify(S2)); inp.style.borderLeftColor=(t&&w[k])?colOf(w[k].c||'other'):'var(--line)'; };
  $('time').querySelectorAll('.slot input').forEach(inp=>{ inp.addEventListener('change',()=>write(inp));
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); write(inp); const all=[...$('time').querySelectorAll('.slot input')]; const n=all[all.indexOf(inp)+1]; if(n) n.focus(); else inp.blur(); }
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ const all=[...$('time').querySelectorAll('.slot input')]; const n=all[all.indexOf(inp)+(e.key==='ArrowDown'?1:-1)]; if(n){ e.preventDefault(); write(inp); n.focus(); } } }); });
})();

/* habits — today's checkboxes */
(function(){
  const st=ls('titan_habits_v1',null); if(!st||!st.habits||!st.habits.length){ $('habits').innerHTML='<div class="empty">No habits set up.</div>'; return; }
  const hiso=d=>isoDay(d); const htoday=today;   // Habits now stores plain local dates (migrated on the Habits page)
  const streak=h=>{ let s=0; const d=new Date(now); d.setHours(0,0,0,0); if(!h.done[hiso(d)]) d.setDate(d.getDate()-1); while(h.done[hiso(d)]){ s++; d.setDate(d.getDate()-1); } return s; };
  $('habits').innerHTML=st.habits.map(h=>'<div class="hab"><div class="chk'+(h.done&&h.done[htoday]?' on':'')+'" role="checkbox" aria-checked="'+(h.done&&h.done[htoday]?'true':'false')+'" tabindex="0" aria-label="'+esc(h.name)+'" data-id="'+esc(h.id)+'"></div><span>'+esc(h.name)+'</span><span class="st">'+(streak(h)?'🔥 '+streak(h):'')+'</span></div>').join('');
  $('habits').addEventListener('click',e=>{ const c=e.target.closest('.chk'); if(!c) return; const s=ls('titan_habits_v1',null); if(!s) return;
    if(!s.dateKeysLocal){ // same migration as the Habits page, so a tick written here is never shifted later
      const off=new Date(); off.setHours(0,0,0,0); if(off.toISOString().slice(0,10)!==isoDay(off)){ s.habits.forEach(x=>{ const nd={}; Object.keys(x.done||{}).forEach(k=>{ const [y,m,d]=k.split('-').map(Number); nd[isoDay(new Date(y,m-1,d+1))]=x.done[k]; }); x.done=nd; }); }
      s.dateKeysLocal=true; s.dateKeysFix2=true; }
    const h=s.habits.find(x=>x.id===c.dataset.id); if(!h) return; h.done=h.done||{}; if(h.done[htoday]) delete h.done[htoday]; else h.done[htoday]=true; localStorage.setItem('titan_habits_v1',JSON.stringify(s)); c.classList.toggle('on',!!h.done[htoday]); });
})();
// keyboard: Space/Enter on any checkbox-like control acts like a click
document.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter') && e.target.getAttribute && e.target.getAttribute('role')==='checkbox'){ e.preventDefault(); e.target.click(); e.target.setAttribute('aria-checked', e.target.classList.contains('on')||e.target.style.background?'true':'false'); } });
</script>
