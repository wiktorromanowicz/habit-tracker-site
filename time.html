<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Apex · Time</title>
<style>
  :root{--bg:#f7f6f2;--card:#fbf9f4;--ink:#2b2a26;--muted:#8c8474;--line:#e7e2d6;--accent:#a9741f;--chip:#f3efe4;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:28px;min-height:100vh;}
  .wrap{max-width:1180px;margin:0 auto;}
  .brand{font-size:15px;font-weight:700;letter-spacing:.3px;margin-bottom:10px;color:var(--ink)}
  .nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .nav a{text-decoration:none;font-size:13px;font-weight:500;color:var(--muted);background:var(--surface,#fff);padding:7px 14px;border-radius:8px;border:1px solid var(--line)}
  .nav a.active{background:var(--chip);border-color:var(--accent);color:var(--accent)}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--surface,#fff);color:var(--ink);padding:7px 12px;font-size:13px;}
  button:hover{background:var(--chip)}
  button.gold{background:var(--accent);border-color:var(--accent);color:#fff}
  button.gold:hover{background:#8f6218}

  .tophead{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  .tophead h1{font-size:24px;margin:0 12px 0 0;letter-spacing:-.3px}
  .tophead .range{font-size:16px;font-weight:600;margin-left:4px}
  .tophead .sp{flex:1}
  .legend{display:flex;gap:6px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--surface,#fff);border:1px solid var(--line)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
  @media (max-width:980px){.layout{grid-template-columns:1fr}}
  .tgrid{background:var(--surface,#fff);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:calc(100vh - 170px);box-shadow:0 1px 3px rgba(20,22,35,.05)}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:700px;table-layout:fixed}
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px}
  th:last-child,td:last-child{border-right:0}
  thead th{position:sticky;top:0;z-index:3;background:var(--card,var(--card,#fbf9f4));padding:8px 6px 6px;text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
  thead th b{display:block;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:0;text-transform:none;margin-top:1px}
  thead th.today b{color:var(--accent)}
  thead th.today{box-shadow:inset 0 -2px 0 var(--accent)}
  th.tcol,td.tcol{position:sticky;left:0;z-index:2;width:64px;background:var(--card,var(--card,#fbf9f4));color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;padding:0 8px;text-align:right;white-space:nowrap}
  thead th.tcol{z-index:4}
  td.tcol b{color:var(--ink);font-weight:600}
  tbody tr.hour td{border-bottom-color:#d9d2c2}
  td.cell{height:34px;padding:0;position:relative;vertical-align:top}
  td.cell .in{min-height:34px;padding:4px 8px;outline:none;line-height:1.3;cursor:cell;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  td.cell .in:empty::before{content:"";}
  td.cell.focus{box-shadow:inset 0 0 0 2px var(--accent);z-index:1}
  td.cell.focus .in{display:block;-webkit-line-clamp:unset;overflow:visible;background:var(--surface,#fff);position:relative;z-index:2;box-shadow:0 6px 18px rgba(20,22,35,.12)}
  td.cell.sel{box-shadow:inset 0 0 0 2px rgba(169,116,31,.45)}
  td.cell .fh{position:absolute;right:-4px;bottom:-4px;width:8px;height:8px;background:var(--accent);border:1px solid #fff;border-radius:2px;cursor:crosshair;display:none;z-index:3}
  td.cell.focus .fh{display:block}
  td.cell.now{box-shadow:inset 3px 0 0 var(--accent)}
  /* categories */
  td.c-work .in{background:#e8f0fe;color:#1a4fa3}
  td.c-meet .in{background:#efe4ff;color:#5b21b6}
  td.c-content .in{background:#fff1d6;color:#8a5a0d}
  td.c-life .in{background:#e6f4ea;color:#166534}
  td.c-sleep .in{background:#e0f2fe;color:#075985;opacity:.75}
  td.c-waste .in{background:#f1f1f1;color:#6b6b6b;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
  thead th .wake{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:12px;color:var(--muted);cursor:pointer;vertical-align:middle;text-transform:none;letter-spacing:0}
  thead th .wake input{border:0;background:transparent;font:inherit;font-size:11px;color:var(--muted);width:62px;padding:0;outline:none;cursor:pointer}
  thead th .wake input:focus,thead th .wake input:not(:placeholder-shown){color:var(--ink)}
  .panel{background:var(--surface,#fff);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,22,35,.05);position:sticky;top:28px}
  .panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .stat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
  .stat b{font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:2px 0 8px}
  .bar i{display:block;height:100%;border-radius:3px}
  .big{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:2px 0 0}
  .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .days div{text-align:center;font-size:11px;color:var(--muted)}
  .days div b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
  .hint{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}
  kbd{font:inherit;font-size:10.5px;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 5px}

  .ctx{position:fixed;z-index:90;background:var(--surface,#fff);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(20,22,35,.2);padding:6px;min-width:190px}
  .ctx button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:13px}
  .ctx button:hover{background:var(--chip)}
  .ctx i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .ctx .k{margin-left:auto;color:var(--muted);font-size:11px}
  .ctx hr{border:0;border-top:1px solid var(--line);margin:5px 0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2a26;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:95;opacity:0;transition:opacity .15s;pointer-events:none}
  .toast.on{opacity:1}
  @media (max-width:700px){ body{padding:14px} .tophead h1{font-size:20px} .tgrid{max-height:none} .panel{position:static} }
</style>
<script>try{var _t=JSON.parse(localStorage.getItem("apexTheme"));if(_t==="dark")document.documentElement.setAttribute("data-theme","dark");if(JSON.parse(localStorage.getItem("apexSideMin")))document.documentElement.setAttribute("data-sb","min");}catch(e){}</script>

  <div class="tophead">
    <h1>Time</h1>
    <button onclick="goToday()">Today</button>
    <button onclick="shift(-1)" title="Previous week">‹</button>
    <button onclick="shift(1)" title="Next week">›</button>
    <span class="range" id="range"></span>
    <button onclick="importCal()" title="Fill empty slots with this week's events from your own Google calendars" style="margin-left:6px">📅 Import from calendar</button>
    <span class="sp"></span>
    <div class="legend" id="legend"></div>
  </div>

  <div class="layout">
    <div class="tgrid"><table id="grid"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- config ---------- */
const START=5*60, END=23*60, STEP=30;                      // 05:00 → 23:00, half-hour rows
const {CATS,LEGACY}=window.ApexTime;
function guessCat(text){ return window.ApexTime.guessCat(text,S.rules); }

// older entries used a longer list — fold them into the new one
const KEY='apexTime';
let S; try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(!S||typeof S!=='object') S={};
S.weeks=S.weeks||{}; S.rules=S.rules||{};
(function(){ let ch=false; for(const wk in S.weeks) for(const k in S.weeks[wk]){ const v=S.weeks[wk][k]; if(v&&LEGACY[v.c]){ v.c=LEGACY[v.c]; ch=true; } if(v&&v.c==='life'&&/\b(sleep|sleeping|nap)\b/i.test(v.t||'')){ v.c='sleep'; ch=true; } } for(const t in S.rules){ if(LEGACY[S.rules[t]]){ S.rules[t]=LEGACY[S.rules[t]]; ch=true; } } if(ch) save(); })();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function hm(m){ return pad(Math.floor(m/60))+':'+pad(m%60); }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600); }

let monday=mondayOf(new Date());
const ROWS=(END-START)/STEP;
function week(){ const k=iso(monday); return S.weeks[k]||(S.weeks[k]={}); }
function setWake(d,val){ const w=week(); if(!val){ delete w['wake_'+d]; save(); return; } w['wake_'+d]=val; const [hh,mm]=val.split(':').map(Number); const until=hh*60+mm;
  for(let r=0;r<ROWS;r++){ const m=START+r*STEP; const k=d+'_'+r; if(m+STEP<=until){ if(!w[k]||!w[k].t||w[k].c==='sleep') w[k]={t:'Sleep',c:'sleep'}; } else if(w[k]&&w[k].c==='sleep'&&w[k].t==='Sleep'){ delete w[k]; } }
  save(); render(); toast('Slept until '+val); }
function cellData(d,r){ return week()[d+'_'+r]; }
function setCell(d,r,t,c){
  const w=week(), k=d+'_'+r;
  t=(t||'').trim();
  if(!t && !c){ delete w[k]; } else { w[k]={t:t}; if(c) w[k].c=c; }
  if(!t && w[k]) delete w[k].c;
  save();
}
/* ---------- render ---------- */
function render(){
  const today=iso(new Date());
  const days=[...Array(7)].map((_,i)=>addDays(monday,i));
  $('range').textContent=days[0].toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+days[6].toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  $('thead').innerHTML='<tr><th class="tcol"></th>'+days.map((d,i)=>{ const wk=week()['wake_'+i]||''; return '<th class="'+(iso(d)===today?'today':'')+'">'+d.toLocaleDateString(undefined,{weekday:'short'})+'<b>'+d.getDate()+'</b><label class="wake" title="Woke up at — fills the morning with Sleep">😴<input type="time" data-d="'+i+'" value="'+wk+'"></label></th>'; }).join('')+'</tr>';
  $('thead').querySelectorAll('input.wake, .wake input').forEach(inp=>inp.addEventListener('change',()=>setWake(+inp.dataset.d, inp.value)));
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  let h='';
  for(let r=0;r<ROWS;r++){
    const m=START+r*STEP; const isHour=(m+STEP)%60===0;
    h+='<tr class="'+(isHour?'hour':'')+'"><td class="tcol">'+(m%60===0?'<b>'+hm(m)+'</b>':'<span style="opacity:.7">'+hm(m)+'</span>')+'</td>';
    for(let d=0;d<7;d++){
      const c=cellData(d,r); const di=iso(days[d]);
      const cls=['cell', c&&c.c?'c-'+c.c:'', di===today&&nowMin>=m&&nowMin<m+STEP?'now':'', (!c||!c.t)?'empty':'', (di<today||(di===today&&m+STEP<=nowMin))?'past':''].join(' ');
      h+='<td class="'+cls+'" data-d="'+d+'" data-r="'+r+'"><div class="in" contenteditable="true" spellcheck="false">'+esc(c&&c.t||'')+'</div><span class="fh" title="Drag to fill"></span></td>';
    }
    h+='</tr>';
  }
  $('tbody').innerHTML=h;
  $('legend').innerHTML=CATS.map(c=>'<span><i style="background:'+c.color+'"></i>'+c.name+'</span>').join('');
  renderPanel();
}
function renderPanel(){
  const w=week(); const per={}; let logged=0; const perDay=[0,0,0,0,0,0,0];
  for(const k in w){ if(k.indexOf('_')<1||k.startsWith('wake')) continue; const v=w[k]; if(!v||!v.t) continue; logged+=.5; const d=+k.split('_')[0]; perDay[d]+=.5; const c=v.c||'other'; per[c]=(per[c]||0)+.5; }
  const total=ROWS*7*.5;
  const rows=CATS.map(c=>({...c,h:per[c.id]||0})).concat(per.other?[{id:'other',name:'Uncategorised',color:'#cfc8b8',h:per.other}]:[]).filter(x=>x.h>0).sort((a,b)=>b.h-a.h);
  const waste=per.waste||0, focus=(per.work||0)+(per.content||0), awake=logged-(per.sleep||0);
  $('panel').innerHTML=
    '<h3>This week</h3><div class="big">'+fmtH(logged)+'<small>logged of '+total+' h</small></div>'+
    '<div class="days">'+['M','T','W','T','F','S','S'].map((l,i)=>'<div>'+l+'<b>'+(perDay[i]?fmtH(perDay[i]):'–')+'</b></div>').join('')+'</div>'+
    '<h3 style="margin-top:16px">By category</h3>'+
    (rows.length?rows.map(r=>'<div class="stat"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'+r.color+';margin-right:7px"></i>'+r.name+'</span><b>'+fmtH(r.h)+'</b></div><div class="bar"><i style="width:'+Math.round(r.h/Math.max(logged,1)*100)+'%;background:'+r.color+'"></i></div>').join(''):'<div class="stat" style="color:var(--muted)">Nothing logged yet</div>')+
    (awake>0?'<div class="stat" style="margin-top:6px"><span>Focused (work + content)</span><b>'+Math.round(focus/awake*100)+'% of awake</b></div><div class="stat"><span>Wasted</span><b>'+Math.round(waste/awake*100)+'%</b></div>':'')+(per.sleep?'<div class="stat"><span>Sleep in grid</span><b>'+fmtH(per.sleep)+'</b></div>':'')+
    '<div class="hint">Type into a slot · <kbd>Enter</kbd> next slot · <kbd>Tab</kbd> next day · drag the corner handle to fill down · right-click or <kbd>⌘1–6</kbd> to set a category — otherwise it’s guessed from the words and learns from your corrections · 😴 in a day header fills the morning with Sleep · <kbd>⌘⌫</kbd> clears</div>';
}
function fmtH(h){ return (Math.round(h*10)/10).toString().replace(/\.0$/,'')+' h'; }

/* ---------- editing ---------- */
const tbody=$('tbody');
function tdOf(el){ return el&&el.closest? el.closest('td.cell'):null; }
function pos(td){ return {d:+td.dataset.d, r:+td.dataset.r}; }
function tdAt(d,r){ return tbody.querySelector('td.cell[data-d="'+d+'"][data-r="'+r+'"]'); }
let focused=null;
tbody.addEventListener('focusin',e=>{ const td=tdOf(e.target); if(!td) return; tbody.querySelectorAll('td.focus').forEach(x=>x.classList.remove('focus')); td.classList.add('focus'); focused=td; });
tbody.addEventListener('focusout',e=>{ const td=tdOf(e.target); if(!td) return; commit(td); td.classList.remove('focus'); });
function commit(td){
  const {d,r}=pos(td); const inp=td.querySelector('.in'); const t=inp.textContent.trim(); const prev=cellData(d,r)||{};
  let c=prev.c; if(t!==(prev.t||'')){ c=guessCat(t)||(t?prev.c:undefined); }
  setCell(d,r,t,c); paint(td); renderPanel();
}
function paint(td){
  const {d,r}=pos(td); const c=cellData(d,r);
  td.className=td.className.replace(/\bc-\w+/g,'').replace(/\bempty\b/,'').trim();
  if(c&&c.c) td.classList.add('c-'+c.c); if(!c||!c.t) td.classList.add('empty');
  const inp=td.querySelector('.in'); if(inp.textContent.trim()!==(c&&c.t||'')) inp.textContent=c&&c.t||'';
}
function focusCell(d,r){ const td=tdAt(d,r); if(!td) return; const inp=td.querySelector('.in'); inp.focus(); const range=document.createRange(); range.selectNodeContents(inp); range.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(range); td.scrollIntoView({block:'nearest',inline:'nearest'}); }
tbody.addEventListener('keydown',e=>{
  const td=tdOf(e.target); if(!td) return; const {d,r}=pos(td); const meta=e.metaKey||e.ctrlKey;
  if(meta && /^[1-6]$/.test(e.key)){ e.preventDefault(); applyCat(td, CATS[+e.key-1].id); return; }
  if(meta && e.key==='0'){ e.preventDefault(); applyCat(td,null); return; }
  if(meta && e.key==='Backspace'){ e.preventDefault(); td.querySelector('.in').textContent=''; setCell(d,r,'',null); paint(td); renderPanel(); return; }
  if(e.key==='Enter'){ e.preventDefault(); commit(td); if(e.shiftKey) focusCell(d,Math.max(0,r-1)); else focusCell(d,Math.min(ROWS-1,r+1)); }
  else if(e.key==='Tab'){ e.preventDefault(); commit(td); focusCell(e.shiftKey?Math.max(0,d-1):Math.min(6,d+1),r); }
  else if(e.key==='ArrowDown' && !e.shiftKey){ e.preventDefault(); commit(td); focusCell(d,Math.min(ROWS-1,r+1)); }
  else if(e.key==='ArrowUp' && !e.shiftKey){ e.preventDefault(); commit(td); focusCell(d,Math.max(0,r-1)); }
  else if(e.key==='Escape'){ e.target.blur(); }
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight') && meta){ e.preventDefault(); commit(td); focusCell(e.key==='ArrowLeft'?Math.max(0,d-1):Math.min(6,d+1),r); }
});
// paste multiple lines → fills down
tbody.addEventListener('paste',e=>{
  const td=tdOf(e.target); if(!td) return; const t=(e.clipboardData||window.clipboardData).getData('text/plain'); const lines=t.split(/\r?\n/).map(x=>x.trim());
  if(lines.length<=1) return; e.preventDefault(); const {d,r}=pos(td);
  lines.forEach((ln,i)=>{ const rr=r+i; if(rr>=ROWS) return; setCell(d,rr,ln,guessCat(ln)); const x=tdAt(d,rr); if(x) paint(x); }); renderPanel();
});
function applyCat(td,cat){
  const {d,r}=pos(td); const c=cellData(d,r); const t=(td.querySelector('.in').textContent||'').trim();
  setCell(d,r,t,cat||undefined); if(t){ if(cat) S.rules[t.toLowerCase()]=cat; else delete S.rules[t.toLowerCase()]; save(); }
  // apply the learned rule to identical text this week
  const w=week(); for(const k in w){ if((w[k].t||'').trim().toLowerCase()===t.toLowerCase() && t){ if(cat) w[k].c=cat; else delete w[k].c; const [dd,rr]=k.split('_'); const x=tdAt(+dd,+rr); if(x) paint(x); } }
  save(); paint(td); renderPanel();
  toast(cat? (CATS.find(x=>x.id===cat).name+(t?' — remembered for “'+t+'”':'')) : 'Category cleared');
}

/* fill handle: drag down (or up) to copy the cell */
let fill=null;
tbody.addEventListener('mousedown',e=>{
  if(!e.target.classList.contains('fh')) return;
  const td=tdOf(e.target); e.preventDefault(); commit(td); fill={src:pos(td), last:null};
  const mv=ev=>{ const t=tdOf(document.elementFromPoint(ev.clientX,ev.clientY)); if(!t) return; const p=pos(t); if(p.d!==fill.src.d) return;
    tbody.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel')); const [a,b]=[Math.min(p.r,fill.src.r),Math.max(p.r,fill.src.r)]; for(let r=a;r<=b;r++) tdAt(fill.src.d,r).classList.add('sel'); fill.last=p; };
  const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
    if(fill.last){ const src=cellData(fill.src.d,fill.src.r)||{}; const [a,b]=[Math.min(fill.last.r,fill.src.r),Math.max(fill.last.r,fill.src.r)]; for(let r=a;r<=b;r++){ setCell(fill.src.d,r,src.t||'',src.c); paint(tdAt(fill.src.d,r)); } renderPanel(); }
    tbody.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel')); fill=null; };
  document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
});

/* right-click: category menu */
let ctx=null; function closeCtx(){ if(ctx){ ctx.remove(); ctx=null; } }
tbody.addEventListener('contextmenu',e=>{
  const td=tdOf(e.target); if(!td) return; e.preventDefault(); closeCtx();
  const cur=(cellData(...Object.values(pos(td)))||{}).c;
  ctx=document.createElement('div'); ctx.className='ctx';
  ctx.innerHTML=CATS.map(c=>'<button data-c="'+c.id+'"><i style="background:'+c.color+'"></i>'+c.name+(cur===c.id?' ✓':'')+'<span class="k">⌘'+c.key+'</span></button>').join('')+'<hr><button data-c=""><i style="background:#ddd"></i>No category<span class="k">⌘0</span></button><button data-a="clear">Clear slot<span class="k">⌘⌫</span></button>';
  ctx.style.left=Math.min(e.clientX,innerWidth-210)+'px'; ctx.style.top=Math.min(e.clientY,innerHeight-300)+'px';
  ctx.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return; if(b.dataset.a==='clear'){ const {d,r}=pos(td); td.querySelector('.in').textContent=''; setCell(d,r,'',null); paint(td); renderPanel(); } else applyCat(td,b.dataset.c||null); closeCtx(); });
  document.body.appendChild(ctx);
});
document.addEventListener('click',e=>{ if(ctx&&!ctx.contains(e.target)) closeCtx(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCtx(); });

/* ---------- import this week's events from Google Calendar (own calendars only) ---------- */
async function importCal(){
  const ls=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
  const tok=ls('apexGTok',null), cache=ls('apexCal',{calendars:[]}), prefs=ls('apexCalPrefs',{hidden:{}});
  if(!tok||tok.e<Date.now()){ toast('Open the Calendar tab first so Google is connected'); return; }
  const mine=c=>!(prefs.hidden&&prefs.hidden[c.id]) && (c.primary || !(/@/.test(c.id) && !/group\.calendar\.google\.com$|holiday|import\.calendar/.test(c.id)));
  const cals=(cache.calendars||[]).filter(mine); if(!cals.length){ toast('No calendars cached yet — open the Calendar tab once'); return; }
  const s0=new Date(monday), e0=addDays(monday,7); const out=[];
  toast('Importing…');
  await Promise.all(cals.map(async c=>{ try{ const q='?singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+encodeURIComponent(s0.toISOString())+'&timeMax='+encodeURIComponent(e0.toISOString());
    const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(c.id)+'/events'+q,{headers:{Authorization:'Bearer '+tok.t}}); if(!r.ok) return; const j=await r.json();
    (j.items||[]).forEach(ev=>{ if(ev.status==='cancelled'||!ev.start||!ev.start.dateTime) return; const me=(ev.attendees||[]).find(a=>a.self); if(me&&me.responseStatus==='declined') return; out.push({t:ev.summary||'(no title)',s:new Date(ev.start.dateTime),e:new Date(ev.end.dateTime)}); }); }catch(err){} }));
  const w=week(); let filled=0, skipped=0;
  out.forEach(ev=>{ const d=(ev.s.getDay()+6)%7; const sm=ev.s.getHours()*60+ev.s.getMinutes(), em=ev.e.getHours()*60+ev.e.getMinutes()+(ev.e.getDate()!==ev.s.getDate()?24*60:0);
    const r0=Math.max(0,Math.floor((sm-START)/STEP)), r1=Math.min(ROWS,Math.ceil((em-START)/STEP));
    for(let r=r0;r<r1;r++){ const k=d+'_'+r; if(w[k]&&w[k].t){ skipped++; continue; } w[k]={t:ev.t}; const c=guessCat(ev.t); if(c) w[k].c=c; filled++; } });
  save(); render();
  toast(out.length? ('Imported '+out.length+' events → '+filled+' slots filled'+(skipped?', '+skipped+' kept as you had them':'')) : 'No events found for this week');
}

/* ---------- navigation ---------- */
function shift(n){ monday=addDays(monday,7*n); render(); }
function goToday(){ monday=mondayOf(new Date()); render(); scrollToNow(); }
function scrollToNow(){ const td=tbody.querySelector('td.now'); if(td) td.scrollIntoView({block:'center'}); }
document.addEventListener('keydown',e=>{
  if(e.target.closest('[contenteditable],input,textarea')) return;
  if(e.key==='ArrowLeft') shift(-1); else if(e.key==='ArrowRight') shift(1); else if(e.key==='t'||e.key==='T') goToday();
});
// keep the "now" marker moving
setInterval(()=>{ const t=new Date(); if(iso(mondayOf(t))!==iso(monday)) return; const m=t.getHours()*60+t.getMinutes(); tbody.querySelectorAll('td.now').forEach(x=>x.classList.remove('now')); const r=Math.floor((m-START)/STEP); const d=(t.getDay()+6)%7; const td=tdAt(d,r); if(td) td.classList.add('now'); },60000);
// storage changes from sync
window.addEventListener('storage',e=>{ if(e.key===KEY && document.activeElement && !document.activeElement.closest('td.cell')){ try{ S=JSON.parse(localStorage.getItem(KEY))||S; S.weeks=S.weeks||{}; S.rules=S.rules||{}; render(); }catch(err){} } });

window.addEventListener('beforeunload',()=>{ const td=focused||tdOf(document.activeElement); if(td&&document.activeElement&&td.contains(document.activeElement)) commit(td); });
render(); scrollToNow();
</script>
