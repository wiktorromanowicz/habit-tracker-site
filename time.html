<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Apex · Time</title>
<style>
  :root{--bg:#f7f6f2;--card:#fbf9f4;--ink:#2b2a26;--muted:#8c8474;--line:#e7e2d6;--accent:#a9741f;--chip:#f3efe4;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:28px;min-height:100vh;}
  .wrap{max-width:1180px;margin:0 auto;}
  .brand{font-size:15px;font-weight:700;letter-spacing:.3px;margin-bottom:10px;color:var(--ink)}
  .nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .nav a{text-decoration:none;font-size:13px;font-weight:500;color:var(--muted);background:var(--surface,#fff);padding:7px 14px;border-radius:8px;border:1px solid var(--line)}
  .nav a.active{background:var(--chip);border-color:var(--accent);color:var(--accent)}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--surface,#fff);color:var(--ink);padding:7px 12px;font-size:13px;}
  button:hover{background:var(--chip)}
  button.gold{background:var(--accent);border-color:var(--accent);color:#fff}
  button.gold:hover{background:#8f6218}

  .tophead{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  .tophead h1{font-size:24px;margin:0 12px 0 0;letter-spacing:-.3px}
  .tophead .range{font-size:16px;font-weight:600;margin-left:4px}
  .tophead .sp{flex:1}
  .legend{display:flex;gap:6px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--surface,#fff);border:1px solid var(--line)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;align-items:start}
  @media (max-width:980px){.layout{grid-template-columns:1fr}}
  .tgrid{background:var(--surface,#fff);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:calc(100vh - 170px);box-shadow:0 1px 3px rgba(20,22,35,.05)}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:700px;table-layout:fixed}
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px}
  th:last-child,td:last-child{border-right:0}
  thead th{position:sticky;top:0;z-index:3;background:var(--card,var(--card,#fbf9f4));padding:8px 6px 6px;text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
  thead th b{display:block;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:0;text-transform:none;margin-top:1px}
  thead th.today b{color:var(--accent)}
  thead th.today{box-shadow:inset 0 -2px 0 var(--accent)}
  th.tcol,td.tcol{position:sticky;left:0;z-index:2;width:64px;background:var(--card,var(--card,#fbf9f4));color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;padding:0 8px;text-align:right;white-space:nowrap}
  thead th.tcol{z-index:4}
  td.tcol b{color:var(--ink);font-weight:600}
  tbody tr.hour td{border-bottom-color:#d9d2c2}
  td.cell{height:34px;padding:0;position:relative;vertical-align:top}
  td.cell .in{min-height:34px;padding:4px 8px;outline:none;line-height:1.3;cursor:cell;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  td.cell .in:empty::before{content:"";}
  td.cell.focus{box-shadow:inset 0 0 0 1.5px var(--accent);z-index:1}
  td.cell.focus .in{display:block;-webkit-line-clamp:unset;overflow:visible;background:var(--surface,#fff);position:relative;z-index:2;border-radius:3px;box-shadow:0 3px 12px rgba(20,22,35,.09)}
  td.cell.sel{box-shadow:inset 0 0 0 2px rgba(169,116,31,.45)}
  td.cell .fh{position:absolute;right:3px;bottom:3px;width:6px;height:6px;background:var(--accent);opacity:.55;border-radius:50%;cursor:ns-resize;display:none;z-index:3}
  td.cell .fh:hover{opacity:1;transform:scale(1.3)}
  td.cell.focus .fh,td.cell:not(.empty):hover .fh{display:block}
  body.filling,body.filling *{user-select:none!important;cursor:cell!important}
  td.cell.now{box-shadow:inset 3px 0 0 var(--accent)}
  td.cell.auto .in{font-style:italic}
  td.cell .ghost{position:absolute;inset:0;padding:4px 8px;font-size:11.5px;font-style:italic;line-height:1.3;color:var(--muted);opacity:.55;pointer-events:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  td.cell.empty:hover .ghost{pointer-events:auto;cursor:copy;opacity:.95;color:#a9741f;background:rgba(169,116,31,.07);border-radius:4px}
  td.cell:not(.empty) .ghost{display:none}          /* a filled slot must never show the plan behind its own text */
  td.cell.focus .ghost{display:none}
  td.cell.offplan{box-shadow:inset 2px 0 0 #c8850f}
  td.cell.auto .in::after{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.4;vertical-align:top;margin-left:4px}
  /* categories — the actual colours are generated into #catCSS from your palette,
     painted on the cell itself so a tall row is filled edge to edge */
  td.cell.c-sleep .in{opacity:.8}
  td.cell.c-waste .in{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
  html[data-theme="dark"] td.cell.c-waste .in{text-decoration-color:rgba(255,255,255,.3)}
  /* colour picker */
  .cpop{position:fixed;z-index:75;background:var(--surface,#fff);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(20,22,35,.18);padding:12px 14px;width:236px;font-size:13px;color:var(--ink)}
  .cpop .ch{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
  .cpop .sw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
  .cpop .sw button{width:100%;aspect-ratio:1;border:1px solid rgba(0,0,0,.12);border-radius:7px;cursor:pointer;padding:0}
  .cpop .sw button.on{outline:2px solid var(--ink);outline-offset:1px}
  .cpop .row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .cpop .row input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}
  .cpop .row span{color:var(--muted);font-size:12px}
  .cpop .nb{display:flex;gap:6px;justify-content:flex-end}
  .cpop .nb button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .legend span{cursor:pointer} .legend span:hover{border-color:var(--accent);color:var(--ink)}
  thead th .nightbtn{display:inline-flex;align-items:center;gap:3px;margin-left:6px;border:1px solid var(--line);background:var(--surface,#fff);color:var(--muted);border-radius:999px;padding:1px 7px;font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;text-transform:none;letter-spacing:0;vertical-align:middle}
  thead th .nightbtn:hover{border-color:#0284c7;color:#0284c7}
  thead th .nightbtn.on{color:#0284c7;border-color:#bae0f5;background:#eaf6fd}
  html[data-theme="dark"] thead th .nightbtn.on{background:#102a3a;border-color:#1d4b66}
  .npop{position:fixed;z-index:70;background:var(--surface,#fff);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(20,22,35,.18);padding:12px 14px;width:270px;font-size:13px;color:var(--ink)}
  .npop .nh{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
  .npop .nr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .npop .nr label{flex:1;color:var(--muted)}
  .npop .nr input{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:inherit;font-size:13px;background:var(--surface,#fff);color:var(--ink);outline:none}
  .npop .nr input:focus{border-color:var(--accent)}
  .npop .nx{font-size:11px;color:var(--muted);line-height:1.45;margin:0 0 6px;padding-top:8px;border-top:1px solid var(--line)}
  .npop .ni{font-size:11.5px;color:var(--muted);line-height:1.4;margin:8px 0 10px;min-height:32px}
  .npop .nb{display:flex;gap:6px;justify-content:flex-end}
  .npop .nb button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .npop .nb .primary{background:var(--accent);border-color:var(--accent);color:#fff}
  thead th .wake{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:12px;color:var(--muted);cursor:pointer;vertical-align:middle;text-transform:none;letter-spacing:0}
  thead th .wake input{border:0;background:transparent;font:inherit;font-size:11px;color:var(--muted);width:62px;padding:0;outline:none;cursor:pointer}
  thead th .wake input:focus,thead th .wake input:not(:placeholder-shown){color:var(--ink)}
  .panel{background:var(--surface,#fff);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,22,35,.05);position:sticky;top:28px}
  .panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .stat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
  .stat b{font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:2px 0 8px}
  .bar i{display:block;height:100%;border-radius:3px}
  .big{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:2px 0 0}
  .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
  .days div{text-align:center;font-size:11px;color:var(--muted)}
  .days div b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
  .hint{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5}
  details.hint>summary{cursor:pointer;font-weight:600;font-size:11px;letter-spacing:.4px;text-transform:uppercase;list-style:none;margin-bottom:4px}
  details.hint>summary::-webkit-details-marker{display:none}
  details.hint>summary::after{content:" ▾";opacity:.6}
  details.hint[open]>summary::after{content:" ▴"}
  details.hint>div{margin:5px 0}
  details.hint b{color:var(--ink);font-weight:600}
  kbd{font:inherit;font-size:10.5px;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 5px}

  .ctx{position:fixed;z-index:90;background:var(--surface,#fff);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(20,22,35,.2);padding:6px;min-width:190px}
  .ctx button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:13px}
  .ctx button:hover{background:var(--chip)}
  .ctx i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .ctx .k{margin-left:auto;color:var(--muted);font-size:11px}
  .ctx hr{border:0;border-top:1px solid var(--line);margin:5px 0}
  .calhint{background:#fff3d6;border:1px solid #efd9a6;color:#8a5a0f;border-radius:10px;padding:9px 13px;font-size:13px;margin:0 0 12px}
  .calhint a{color:#8a5a0f}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2a26;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:95;opacity:0;transition:opacity .15s;pointer-events:none}
  .toast.on{opacity:1}
  @media (max-width:700px){ body{padding:14px} .tophead h1{font-size:20px} .tgrid{max-height:none} .panel{position:static} }
</style>

    <button onclick="goToday()">Today</button>
    <button onclick="shift(-1)" title="Previous week">‹</button>
    <button onclick="shift(1)" title="Next week">›</button>
    <span class="range" id="range"></span>
    <button onclick="importCal()" title="Fill empty slots with this week's events from your own Google calendars" style="margin-left:6px">📅 Import week</button>
    <button onclick="clearAutoWeek()" title="Remove every slot that was filled from the calendar (leaves what you typed)">🧹 Clear imported</button>
    <button onclick="undoTime()" title="Undo the last bulk change to this sheet">↩︎ Undo</button>
    <button onclick="openBedtime()" id="bedBtn" title="Nights without a logged bedtime use this">🌙 Bedtime</button>
    <button onclick="togglePlan()" id="planBtn" class="on" title="Show what your calendar had planned behind each slot">📋 Plan layer</button>

<script>
/* ---------- config ---------- */
const START=5*60, END=23*60, STEP=30;                      // 05:00 → 23:00, half-hour rows
const {CATS,LEGACY}=window.ApexTime;
function guessCat(text){ return window.ApexTime.guessCat(text,S.rules); }

// older entries used a longer list — fold them into the new one
const KEY='apexTime';
let S; try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(!S||typeof S!=='object') S={};
S.weeks=S.weeks||{}; S.rules=S.rules||{}; S.settings=S.settings||{bed:'23:30'};
(function(){ let ch=false; for(const wk in S.weeks) for(const k in S.weeks[wk]){ const v=S.weeks[wk][k]; if(v&&LEGACY[v.c]){ v.c=LEGACY[v.c]; ch=true; } if(v&&v.c==='life'&&/\b(sleep|sleeping|nap)\b/i.test(v.t||'')){ v.c='sleep'; ch=true; } } for(const t in S.rules){ if(LEGACY[S.rules[t]]){ S.rules[t]=LEGACY[S.rules[t]]; ch=true; } } if(ch) save(); })();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function hm(m){ return pad(Math.floor(m/60))+':'+pad(m%60); }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600); }

let monday=mondayOf(new Date());
let PLAN={};                                  // "d_r" → what the calendar had planned for that slot
const ROWS=(END-START)/STEP;
function week(){ const k=iso(monday); return S.weeks[k]||(S.weeks[k]={}); }
function setWake(d,val){ setNight(d, ((week()['night_'+d]||'').split('-')[0]||''), val); }
function setNight(d,bed,wake){
  const w=week();
  if(!wake && !bed){ delete w['wake_'+d]; delete w['night_'+d]; clearSleepRows(d); save(); render(); return; }
  if(wake) w['wake_'+d]=wake; else delete w['wake_'+d];
  if(bed&&wake) w['night_'+d]=bed+'-'+wake; else delete w['night_'+d];
  // the morning the grid can show: 05:00 → wake
  if(wake){ const [hh,mm]=wake.split(':').map(Number); const until=hh*60+mm;
    for(let r=0;r<ROWS;r++){ const m=START+r*STEP; const k=d+'_'+r;
      if(m+STEP<=until){ if(!w[k]||!w[k].t||w[k].c==='sleep') w[k]={t:'Sleep',c:'sleep'}; }
      else if(w[k]&&w[k].c==='sleep'&&w[k].t==='Sleep'&&m<12*60) delete w[k]; }
  }
  // and the evening before, when you were already in bed before 23:00 (previous column)
  const info=window.ApexTime.parseNight(bed&&wake?bed+'-'+wake:'', {firstDayOfWeek:d===0});
  if(info&&!info.sameDay&&info.prevIn>0&&d>0){ const pd=d-1;
    for(let r=0;r<ROWS;r++){ const m=START+r*STEP; const k=pd+'_'+r;
      if(m>=info.bed){ if(!w[k]||!w[k].t||w[k].c==='sleep') w[k]={t:'Sleep',c:'sleep'}; } }
  }
  save(); render();
  toast(info? ('Night logged: '+(Math.round(info.total*10)/10)+' h'+(info.offGrid?' ('+(Math.round(info.offGrid*10)/10)+' h outside the sheet)':'')) : (wake?'Slept until '+wake:'Cleared'));
}
function clearSleepRows(d){ const w=week(); for(let r=0;r<ROWS;r++){ const k=d+'_'+r; if(w[k]&&w[k].c==='sleep'&&w[k].t==='Sleep') delete w[k]; } }
function cellData(d,r){ return week()[d+'_'+r]; }
function setCell(d,r,t,c){
  const w=week(), k=d+'_'+r;
  t=(t||'').trim();
  if(!t && !c){ delete w[k]; } else { w[k]={t:t}; if(c) w[k].c=c; }
  if(!t && w[k]) delete w[k].c;
  save();
}
/* ---------- category palette ---------- */
function catColor(id){ const o=(S.settings&&S.settings.colors)||{}; if(o[id]) return o[id]; const c=CATS.find(x=>x.id===id); return c?c.color:'#8a8a8a'; }
function hexRgb(h){ const m=/^#?([0-9a-f]{6})$/i.exec(h||''); if(!m) return [138,138,138]; const n=parseInt(m[1],16); return [n>>16&255,n>>8&255,n&255]; }
function mix(c,k){ return Math.round(Math.min(255,Math.max(0,c*k))); }
function buildCatCSS(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  let css='';
  CATS.forEach(c=>{
    const [r,g,b]=hexRgb(catColor(c.id));
    const bg=dark?'rgba('+r+','+g+','+b+',.26)':'rgba('+r+','+g+','+b+',.15)';
    const k=dark?1.45:.62;
    const tx='rgb('+mix(r,k)+','+mix(g,k)+','+mix(b,k)+')';
    css+='td.cell.c-'+c.id+'{background:'+bg+'}\n';
    css+='td.cell.c-'+c.id+' .in{color:'+tx+'}\n';
  });
  $('catCSS').textContent=css;
}
new MutationObserver(buildCatCSS).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
/* click a legend chip to recolour that category */
let cpop=null;
function closeCPop(){ if(cpop){ cpop.remove(); cpop=null; } }
document.addEventListener('pointerdown',e=>{ if(cpop&&!cpop.contains(e.target)&&!e.target.closest('.legend span')) closeCPop(); },true);
function openColor(id,el){
  closeCPop();
  const cat=CATS.find(c=>c.id===id); if(!cat) return;
  const cur=catColor(id);
  const PRESETS=['#1a4fa3','#2563eb','#0284c7','#0d9488','#16a34a','#65a30d','#c8850f','#ea580c','#dc2626','#db2777','#7c3aed','#8a8a8a'];
  cpop=document.createElement('div'); cpop.className='cpop';
  cpop.innerHTML='<div class="ch">'+esc(cat.name)+' colour</div>'+
    '<div class="sw">'+PRESETS.map(p=>'<button data-c="'+p+'" style="background:'+p+'"'+(p.toLowerCase()===cur.toLowerCase()?' class="on"':'')+' title="'+p+'"></button>').join('')+'</div>'+
    '<div class="row"><input type="color" id="cIn" value="'+cur+'"><span>or pick your own</span></div>'+
    '<div class="nb"><button data-a="reset">Default</button><button data-a="close">Done</button></div>';
  document.body.appendChild(cpop);
  const r=el.getBoundingClientRect(), W=cpop.offsetWidth;
  cpop.style.left=Math.max(8,Math.min(r.left,innerWidth-W-10))+'px';
  cpop.style.top=Math.min(r.bottom+6,innerHeight-cpop.offsetHeight-10)+'px';
  const apply=v=>{ S.settings=S.settings||{}; S.settings.colors=S.settings.colors||{}; S.settings.colors[id]=v; save(); buildCatCSS(); render(); };
  cpop.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{ apply(b.dataset.c); closeCPop(); });
  $('cIn').addEventListener('input',e=>apply(e.target.value));
  cpop.querySelector('[data-a=reset]').onclick=()=>{ if(S.settings&&S.settings.colors) delete S.settings.colors[id]; save(); buildCatCSS(); render(); closeCPop(); };
  cpop.querySelector('[data-a=close]').onclick=closeCPop;
}

/* ---------- render ---------- */
function render(){
  const today=iso(new Date());
  const days=[...Array(7)].map((_,i)=>addDays(monday,i));
  $('range').textContent=days[0].toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+days[6].toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  $('thead').innerHTML='<tr><th class="tcol"></th>'+days.map((d,i)=>{ const W=week();
    const info=window.ApexTime.nightFor(W,i,S.settings);
    const lbl=info? ((info.inferred?'~':'')+(Math.round(info.total*10)/10)+' h') : 'sleep';
    return '<th class="'+(iso(d)===today?'today':'')+'">'+d.toLocaleDateString(undefined,{weekday:'short'})+'<b>'+d.getDate()+'</b>'+
      '<button class="nightbtn'+(info?' on':'')+'" data-d="'+i+'" title="Night sleep — the hours outside 05:00–23:00 are counted even though the sheet has no rows for them">🌙 '+lbl+'</button></th>'; }).join('')+'</tr>';
  $('thead').querySelectorAll('.nightbtn').forEach(b=>b.addEventListener('click',e=>openNight(+b.dataset.d,b)));
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  let h='';
  for(let r=0;r<ROWS;r++){
    const m=START+r*STEP; const isHour=(m+STEP)%60===0;
    h+='<tr class="'+(isHour?'hour':'')+'"><td class="tcol">'+(m%60===0?'<b>'+hm(m)+'</b>':'<span style="opacity:.7">'+hm(m)+'</span>')+'</td>';
    for(let d=0;d<7;d++){
      const c=cellData(d,r); const di=iso(days[d]);
      const cls=['cell', c&&c.c?'c-'+c.c:'', c&&c.a?'auto':'', di===today&&nowMin>=m&&nowMin<m+STEP?'now':'', (!c||!c.t)?'empty':'', (di<today||(di===today&&m+STEP<=nowMin))?'past':''].join(' ');
      const plan=(S.settings&&S.settings.plan===false)?null:PLAN[d+'_'+r];
      const off=plan&&c&&c.t&&c.t.trim().toLowerCase()!==plan.trim().toLowerCase();
      h+='<td class="'+cls+(off?' offplan':'')+'" data-d="'+d+'" data-r="'+r+'"'+(plan?' data-plan="'+esc(plan)+'"':'')+(off?' title="Planned: '+esc(plan)+'"':'')+'>'+
        '<div class="in" contenteditable="true" spellcheck="false">'+esc(c&&c.t||'')+'</div>'+
        (plan&&!(c&&c.t)?'<span class="ghost" title="Planned — click to log it as done">'+esc(plan)+'</span>':'')+
        '<span class="fh" title="Drag to fill"></span></td>';
    }
    h+='</tr>';
  }
  $('tbody').innerHTML=h;
  $('legend').innerHTML=CATS.map(c=>'<span data-c="'+c.id+'" title="Click to change this colour"><i style="background:'+catColor(c.id)+'"></i>'+c.name+'</span>').join('');
  $('legend').querySelectorAll('span').forEach(sp=>sp.addEventListener('click',()=>openColor(sp.dataset.c,sp)));
  buildCatCSS();
  renderPanel();
}
function renderPanel(){
  const w=week(); const per={}; let logged=0; const perDay=[0,0,0,0,0,0,0];
  for(const k in w){ if(k.indexOf('_')<1||k.startsWith('wake')||k.startsWith('night')) continue; const v=w[k]; if(!v||!v.t) continue; logged+=.5; const d=+k.split('_')[0]; perDay[d]+=.5; const c=v.c||'other'; per[c]=(per[c]||0)+.5; }
  // sleep the 05:00–23:00 sheet has no rows for (from the 🌙–☀ times in each day header)
  let night=0, guessed=false;
  for(let d=0;d<7;d++){ const n=window.ApexTime.nightFor(w,d,S.settings); if(n&&n.offGrid>0){ night+=n.offGrid; perDay[d]+=n.offGrid; if(n.inferredBed) guessed=true; } }
  if(night){ logged+=night; per.sleep=(per.sleep||0)+night; }
  const total=ROWS*7*.5;
  // completeness of the elapsed part of this week (only meaningful for the current/past weeks)
  const nowT=new Date(); const curMon=iso(mondayOf(nowT)), thisMon=iso(monday); let elapsed=0, filledSoFar=0;
  if(thisMon<curMon) elapsed=ROWS*7; else if(thisMon===curMon){ const dow=(nowT.getDay()+6)%7, rNow=Math.floor((nowT.getHours()*60+nowT.getMinutes()-START)/STEP); elapsed=dow*ROWS+Math.max(0,Math.min(ROWS,rNow+1)); for(const k in w){ if(k.indexOf('_')<1||k.startsWith('wake')||!w[k]||!w[k].t) continue; const [d,r]=k.split('_').map(Number); if(d<dow||(d===dow&&r<=rNow)) filledSoFar++; } }
  if(thisMon<curMon) filledSoFar=logged*2;
  const pct=elapsed?Math.min(100,Math.round(filledSoFar/elapsed*100)):null;
  // plan vs actual, for planned slots that have already passed
  let pTotal=0, pKept=0, pSwapped=0, pMissed=0;
  if(!(S.settings&&S.settings.plan===false)){
    const nowT2=new Date(), sameWeek=iso(mondayOf(nowT2))===iso(monday), past=iso(monday)<iso(mondayOf(nowT2));
    const dowN=(nowT2.getDay()+6)%7, rN=Math.floor((nowT2.getHours()*60+nowT2.getMinutes()-START)/STEP);
    for(const k in PLAN){ const [d,r]=k.split('_').map(Number);
      if(sameWeek && !(d<dowN||(d===dowN&&r<=rN))) continue;         // hasn't happened yet
      if(!past && !sameWeek) continue;
      pTotal++;
      const v=w[k];
      if(!v||!v.t) pMissed++;
      else if(v.t.trim().toLowerCase()===PLAN[k].trim().toLowerCase()) pKept++;
      else pSwapped++;
    }
  }
  const rows=CATS.map(c=>({...c,color:catColor(c.id),h:per[c.id]||0})).concat(per.other?[{id:'other',name:'Uncategorised',color:'#cfc8b8',h:per.other}]:[]).filter(x=>x.h>0).sort((a,b)=>b.h-a.h);
  const waste=per.waste||0, focus=(per.work||0)+(per.content||0), awake=logged-(per.sleep||0);
  $('panel').innerHTML=
    '<h3>This week</h3><div class="big">'+fmtH(logged)+'<small>logged'+(night?' (incl. '+fmtH(night)+' night)':' of '+total+' h')+'</small></div>'+
    (pct!==null?'<div class="stat" style="margin-top:-4px"><span>Filled in so far</span><b>'+pct+'%</b></div><div class="bar"><i style="width:'+pct+'%;background:var(--accent)"></i></div>':'')+
    '<div class="days">'+['M','T','W','T','F','S','S'].map((l,i)=>'<div>'+l+'<b>'+(perDay[i]?fmtH(perDay[i]):'–')+'</b></div>').join('')+'</div>'+
    (pTotal?'<h3 style="margin-top:16px">Plan vs actual</h3>'+
      '<div class="stat"><span>Went as planned</span><b>'+Math.round(pKept/pTotal*100)+'% of '+fmtH(pTotal*.5)+'</b></div>'+
      '<div class="bar"><i style="width:'+Math.round(pKept/pTotal*100)+'%;background:#16a34a"></i></div>'+
      (pSwapped?'<div class="stat"><span>Did something else</span><b>'+fmtH(pSwapped*.5)+'</b></div>':'')+
      (pMissed?'<div class="stat"><span>Planned but not logged</span><b>'+fmtH(pMissed*.5)+'</b></div>':''):'')+
    '<h3 style="margin-top:16px">By category</h3>'+
    (rows.length?rows.map(r=>'<div class="stat"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'+r.color+';margin-right:7px"></i>'+r.name+'</span><b>'+fmtH(r.h)+'</b></div><div class="bar"><i style="width:'+Math.round(r.h/Math.max(logged,1)*100)+'%;background:'+r.color+'"></i></div>').join(''):'<div class="stat" style="color:var(--muted)">Nothing logged yet</div>')+
    (awake>0?'<div class="stat" style="margin-top:6px"><span>Focused (work + content)</span><b>'+Math.round(focus/awake*100)+'% of awake</b></div><div class="stat"><span>Wasted</span><b>'+Math.round(waste/awake*100)+'%</b></div>':'')+(night?'<div class="stat"><span>of which outside 05:00–23:00</span><b>'+fmtH(night)+'</b></div>'+(guessed?'<div class="stat" style="color:var(--muted);font-size:11.5px"><span>nights without a bedtime assume you are in bed by '+esc(S.settings.bed)+'</span><b><button onclick="openBedtime()" style="border:0;background:transparent;color:var(--accent);font:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline dotted">change</button></b></div>':''):'')+
    '<details class="hint"><summary>How this sheet works</summary>'+
      '<div><b>Type</b> in a slot · <kbd>Enter</kbd> next slot · <kbd>Tab</kbd> next day</div>'+
      '<div><b>Drag</b> a slot up, down or sideways — down stretches the hours, sideways copies it to other days</div>'+
      '<div><b>Click a colour chip</b> in the legend to recolour that category</div>'+
      '<div><b>Right-click</b> or <kbd>⌘1–8</kbd> to set a category — otherwise it is guessed from the words and learns from your corrections</div>'+
      '<div><b>🌙 in a day header</b> for the night — sleep outside 05:00–23:00 is counted from your sleep rows and usual bedtime</div>'+
      '<div><b>📋 Plan layer</b> shows what the calendar had planned behind each empty slot — click the faint text to log it as done; an amber edge means you did something else</div>'+
      '<div><b>📅 Import week</b> fills every planned slot at once (italic); editing one makes it yours</div>'+
      '<div><kbd>⌘⌫</kbd> clears a slot · <kbd>↩︎ Undo</kbd> reverses a bulk change</div>'+
    '</details>';
}
function fmtH(h){ return (Math.round(h*10)/10).toString().replace(/\.0$/,'')+' h'; }

/* ---------- editing ---------- */
const tbody=$('tbody');
function tdOf(el){ return el&&el.closest? el.closest('td.cell'):null; }
function pos(td){ return {d:+td.dataset.d, r:+td.dataset.r}; }
function tdAt(d,r){ return tbody.querySelector('td.cell[data-d="'+d+'"][data-r="'+r+'"]'); }
let focused=null;
tbody.addEventListener('focusin',e=>{ const td=tdOf(e.target); if(!td) return; if(pendingRange){ const p=pos(td); if(p.d<pendingRange.d0||p.d>pendingRange.d1||p.r<pendingRange.a||p.r>pendingRange.b){ pendingRange=null; tbody.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel')); } } tbody.querySelectorAll('td.focus').forEach(x=>x.classList.remove('focus')); td.classList.add('focus'); focused=td; });
tbody.addEventListener('focusout',e=>{ const td=tdOf(e.target); if(!td) return; commit(td); td.classList.remove('focus'); });
function commit(td){
  const {d,r}=pos(td); const inp=td.querySelector('.in'); const t=inp.textContent.trim(); const prev=cellData(d,r)||{};
  let c=prev.c; if(t!==(prev.t||'')){ c=guessCat(t)||(t?prev.c:undefined); }
  setCell(d,r,t,c); paint(td);
  if(pendingRange&&d>=pendingRange.d0&&d<=pendingRange.d1&&r>=pendingRange.a&&r<=pendingRange.b){ const pr=pendingRange; pendingRange=null;
    tbody.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel'));
    if(t){ for(let dd=pr.d0;dd<=pr.d1;dd++) for(let rr=pr.a;rr<=pr.b;rr++){ setCell(dd,rr,t,c); const x=tdAt(dd,rr); if(x) paint(x); } } }
  renderPanel();
}
function paint(td){
  const {d,r}=pos(td); const c=cellData(d,r);
  td.className=td.className.replace(/\bc-\w+/g,'').replace(/\bempty\b/,'').replace(/\bauto\b/,'').trim();
  if(c&&c.c) td.classList.add('c-'+c.c); if(c&&c.a) td.classList.add('auto'); if(!c||!c.t) td.classList.add('empty');
  const inp=td.querySelector('.in'); if(inp.textContent.trim()!==(c&&c.t||'')) inp.textContent=c&&c.t||'';
}
function focusCell(d,r){ const td=tdAt(d,r); if(!td) return; const inp=td.querySelector('.in'); inp.focus(); const range=document.createRange(); range.selectNodeContents(inp); range.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(range); td.scrollIntoView({block:'nearest',inline:'nearest'}); }
tbody.addEventListener('keydown',e=>{
  const td=tdOf(e.target); if(!td) return; const {d,r}=pos(td); const meta=e.metaKey||e.ctrlKey;
  if(meta && /^[1-8]$/.test(e.key)){ e.preventDefault(); applyCat(td, CATS[+e.key-1].id); return; }
  if(meta && e.key==='0'){ e.preventDefault(); applyCat(td,null); return; }
  if(meta && e.key==='Backspace'){ e.preventDefault(); td.querySelector('.in').textContent=''; setCell(d,r,'',null); paint(td); renderPanel(); return; }
  if(e.key==='Enter'){ e.preventDefault(); commit(td); if(e.shiftKey) focusCell(d,Math.max(0,r-1)); else focusCell(d,Math.min(ROWS-1,r+1)); }
  else if(e.key==='Tab'){ e.preventDefault(); commit(td); focusCell(e.shiftKey?Math.max(0,d-1):Math.min(6,d+1),r); }
  else if(e.key==='ArrowDown' && !e.shiftKey){ e.preventDefault(); commit(td); focusCell(d,Math.min(ROWS-1,r+1)); }
  else if(e.key==='ArrowUp' && !e.shiftKey){ e.preventDefault(); commit(td); focusCell(d,Math.max(0,r-1)); }
  else if(e.key==='Escape'){ e.target.blur(); }
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight') && meta){ e.preventDefault(); commit(td); focusCell(e.key==='ArrowLeft'?Math.max(0,d-1):Math.min(6,d+1),r); }
});
// paste multiple lines → fills down
tbody.addEventListener('paste',e=>{
  const td=tdOf(e.target); if(!td) return; const t=(e.clipboardData||window.clipboardData).getData('text/plain'); const lines=t.split(/\r?\n/).map(x=>x.trim());
  if(lines.length<=1) return; e.preventDefault(); const {d,r}=pos(td);
  lines.forEach((ln,i)=>{ const rr=r+i; if(rr>=ROWS) return; setCell(d,rr,ln,guessCat(ln)); const x=tdAt(d,rr); if(x) paint(x); }); renderPanel();
});
function applyCat(td,cat){
  const {d,r}=pos(td); const c=cellData(d,r); const t=(td.querySelector('.in').textContent||'').trim();
  setCell(d,r,t,cat||undefined); if(t){ if(cat) S.rules[t.toLowerCase()]=cat; else delete S.rules[t.toLowerCase()]; save(); }
  // apply the learned rule to identical text this week
  const w=week(); for(const k in w){ if((w[k].t||'').trim().toLowerCase()===t.toLowerCase() && t){ if(cat) w[k].c=cat; else delete w[k].c; const [dd,rr]=k.split('_'); const x=tdAt(+dd,+rr); if(x) paint(x); } }
  save(); paint(td); renderPanel();
  toast(cat? (CATS.find(x=>x.id===cat).name+(t?' — remembered for “'+t+'”':'')) : 'Category cleared');
}

/* drag to fill: press on a slot and drag up/down to stretch it over more half-hours.
   (the corner handle still works; dragging an empty slot selects a range — type once, it fills all of them) */
let fill=null, pendingRange=null;
tbody.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  const td=tdOf(e.target); if(!td) return;
  if(!e.target.classList.contains('fh')){
    // start of a possible drag from the cell body: only becomes a fill once the pointer leaves the row
    if(td.classList.contains('focus')) return;           // already editing this cell → normal text selection
    const start={x:e.clientX,y:e.clientY}, src=pos(td); let armed=false;
    const mv0=ev=>{ if(armed) return;
      if(Math.abs(ev.clientY-start.y)<8 && Math.abs(ev.clientX-start.x)<12) return;      // sideways counts too
      const t=tdOf(document.elementFromPoint(ev.clientX,ev.clientY)); if(!t) return;
      const q=pos(t); if(q.r===src.r && q.d===src.d) return;
      armed=true; document.removeEventListener('mousemove',mv0); document.removeEventListener('mouseup',up0); if(document.activeElement) document.activeElement.blur(); getSelection().removeAllRanges(); beginFill(src); mv(ev); };
    const up0=()=>{ document.removeEventListener('mousemove',mv0); document.removeEventListener('mouseup',up0); };
    document.addEventListener('mousemove',mv0); document.addEventListener('mouseup',up0); return;
  }
  e.preventDefault(); commit(td); beginFill(pos(td));
});
function beginFill(src){ fill={src, last:null}; document.body.classList.add('filling'); document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); }
const mv=ev=>{ if(!fill) return; const t=tdOf(document.elementFromPoint(ev.clientX,ev.clientY)); if(!t) return; const p=pos(t);
    tbody.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel'));
    const [a,b]=[Math.min(p.r,fill.src.r),Math.max(p.r,fill.src.r)];
    const [c,d2]=[Math.min(p.d,fill.src.d),Math.max(p.d,fill.src.d)];     // sideways too: copy across days
    for(let dd=c;dd<=d2;dd++) for(let r=a;r<=b;r++){ const x=tdAt(dd,r); if(x) x.classList.add('sel'); }
    fill.last=p; };
const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); document.body.classList.remove('filling');
    if(fill&&fill.last){ const src=cellData(fill.src.d,fill.src.r)||{};
      const [a,b]=[Math.min(fill.last.r,fill.src.r),Math.max(fill.last.r,fill.src.r)];
      const [c0,c1]=[Math.min(fill.last.d,fill.src.d),Math.max(fill.last.d,fill.src.d)];
      const slots=(b-a+1)*(c1-c0+1), days=c1-c0+1;
      if(src.t){ for(let dd=c0;dd<=c1;dd++) for(let r=a;r<=b;r++){ setCell(dd,r,src.t||'',src.c); const x=tdAt(dd,r); if(x) paint(x); }
        renderPanel(); toast(days>1? ('Copied to '+days+' days ('+(slots/2)+' h)') : ('Stretched to '+((b-a+1)/2)+' h'));
        tbody.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel')); }
      else { pendingRange={d0:c0,d1:c1,a,b}; focusCell(c0,a); toast('Type once to fill '+(slots/2)+' h'); } }
    else tbody.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel'));
    fill=null; };


function openBedtime(){
  const v=prompt('Usual bedtime (HH:MM) — used for any night where you have not logged going to bed:', S.settings.bed||'23:30');
  if(v===null) return;
  if(!/^\d{1,2}:\d{2}$/.test(v.trim())){ toast('Use HH:MM, e.g. 23:30'); return; }
  S.settings.bed=v.trim(); save(); render(); toast('Usual bedtime '+S.settings.bed);
}
/* night sleep popover (🌙 in a day header) */
let npop=null;
function closeNight(){ if(npop){ npop.remove(); npop=null; } }
document.addEventListener('pointerdown',e=>{ if(npop&&!npop.contains(e.target)&&!e.target.closest('.nightbtn')) closeNight(); },true);
function openNight(d,btn){
  if(npop){ closeNight(); return; }
  const W=week(); const cur=(W['night_'+d]||'').split('-');
  const auto=window.ApexTime.nightFor(W,d,S.settings);
  const hm2=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const bed=cur[0]||(auto?hm2(auto.bed):''), wake=cur[1]||W['wake_'+d]||(auto?hm2(auto.wake):'');
  const day=addDays(monday,d).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  npop=document.createElement('div'); npop.className='npop';
  npop.innerHTML='<div class="nh">Sleep · '+day+'</div>'+
    '<div class="nr"><label>Went to bed</label><input type="time" id="nBed" value="'+bed+'"></div>'+
    '<div class="nr"><label>Woke up</label><input type="time" id="nWake" value="'+wake+'"></div>'+
    '<div class="ni" id="nOut"></div>'+
    (auto&&auto.inferred?'<div class="nx">Worked out from the sleep rows in the sheet'+(auto.inferredBed?' and your usual bedtime <b>'+esc(S.settings.bed)+'</b>':'')+'. Saving exact times overrides it for this day.</div>':'')+
    '<div class="nr" style="margin-top:8px"><label>Usual bedtime</label><input type="time" id="nUsual" value="'+esc(S.settings.bed||'23:30')+'" title="Used for any night where you have not logged going to bed"></div>'+
    '<div class="nb"><button data-a="clear">Clear</button><button class="primary" data-a="save">Save</button></div>';
  document.body.appendChild(npop);
  const r=btn.getBoundingClientRect(), W2=npop.offsetWidth;
  npop.style.left=Math.max(8,Math.min(r.left, innerWidth-W2-10))+'px';
  npop.style.top=(r.bottom+6)+'px';
  const B=$('nBed'), K=$('nWake'), out=$('nOut');
  const preview=()=>{ const i=window.ApexTime.parseNight(B.value&&K.value?B.value+'-'+K.value:'',{firstDayOfWeek:d===0});
    out.textContent=i? (Math.round(i.total*10)/10)+' h in bed — '+(Math.round(i.offGrid*10)/10)+' h of it outside 05:00–23:00, counted as Sleep' : 'Set both times to log the whole night.'; };
  [B,K].forEach(x=>x.addEventListener('input',preview)); preview();
  npop.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter'){ e.preventDefault(); npop.querySelector('[data-a=save]').click(); } if(e.key==='Escape') closeNight(); });
  $('nUsual').addEventListener('change',e=>{ S.settings.bed=e.target.value||'23:30'; save(); render(); toast('Usual bedtime '+S.settings.bed); });
  npop.querySelector('[data-a=save]').onclick=()=>{ setNight(d,B.value,K.value); closeNight(); };
  npop.querySelector('[data-a=clear]').onclick=()=>{ setNight(d,'',''); closeNight(); };
  B.focus();
}

/* click a ghost (planned) slot to log it as what actually happened */
tbody.addEventListener('click',e=>{
  const g=e.target.closest('.ghost'); if(!g) return;
  const td=tdOf(g); if(!td) return;
  const {d,r}=pos(td); const t=td.dataset.plan||''; if(!t) return;
  setCell(d,r,t,guessCat(t)); paint(td); renderPanel();
});

/* right-click: category menu */
let ctx=null; function closeCtx(){ if(ctx){ ctx.remove(); ctx=null; } }
tbody.addEventListener('contextmenu',e=>{
  const td=tdOf(e.target); if(!td) return; e.preventDefault(); closeCtx();
  const cur=(cellData(...Object.values(pos(td)))||{}).c;
  ctx=document.createElement('div'); ctx.className='ctx';
  ctx.innerHTML=CATS.map(c=>'<button data-c="'+c.id+'"><i style="background:'+c.color+'"></i>'+c.name+(cur===c.id?' ✓':'')+'<span class="k">⌘'+c.key+'</span></button>').join('')+'<hr><button data-c=""><i style="background:#ddd"></i>No category<span class="k">⌘0</span></button><button data-a="clear">Clear slot<span class="k">⌘⌫</span></button>';
  ctx.style.left=Math.min(e.clientX,innerWidth-210)+'px'; ctx.style.top=Math.min(e.clientY,innerHeight-300)+'px';
  ctx.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b) return; if(b.dataset.a==='clear'){ const {d,r}=pos(td); td.querySelector('.in').textContent=''; setCell(d,r,'',null); paint(td); renderPanel(); } else applyCat(td,b.dataset.c||null); closeCtx(); });
  document.body.appendChild(ctx);
});
document.addEventListener('click',e=>{ if(ctx&&!ctx.contains(e.target)) closeCtx(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCtx(); });

/* ---------- fill the grid from Google Calendar (own calendars only) ---------- */
function reloadState(){ try{ S=JSON.parse(localStorage.getItem(KEY))||S; S.weeks=S.weeks||{}; S.rules=S.rules||{}; }catch(e){} }
async function importCal(){
  toast('Importing…');
  const r=await window.ApexTime.fillFromCalendar({from:new Date(monday), to:addDays(monday,7), onlyPast:false});
  if(!r.ok){ toast(r.reason==='not-connected'?'Open the Calendar tab once so Google is connected':'No calendars found — open the Calendar tab once'); return; }
  reloadState(); render();
  toast(r.events? ('Imported '+r.events+' events → '+r.filled+' slots filled'+(r.kept?', '+r.kept+' kept as you had them':'')) : 'No events found for this week');
}
/* One-time: existing "Life" slots get re-read with the new Health / People lexicon.
   Snapshots first and waits for the cloud copy, so it can't clobber another device. */
async function migrateCats(){
  if(S.settings && S.settings.catsV >= 2) return;
  try{ const t0=Date.now(); while(!window.apexSyncReady && Date.now()-t0<3000) await new Promise(r=>setTimeout(r,100));
       if(window.apexSyncReady) await Promise.race([window.apexSyncReady, new Promise(r=>setTimeout(r,6000))]); }catch(e){}
  reloadState();
  let n=0, seen=0; const touched=[];
  for(const wk in S.weeks){ const w=S.weeks[wk];
    for(const k in w){ if(k.startsWith('wake')||k.startsWith('night')) continue;
      const v=w[k]; if(!v||!v.t) continue;
      seen++;
      const c=v.c||'other';
      if(c!=='life'&&c!=='other'&&c!=='gym') continue;              // only what used to live under Life
      const g=window.ApexTime.guessCat(v.t,S.rules||{});
      if(g&&(g==='health'||g==='social')&&g!==c){ touched.push([w,k,g]); n++; }
    } }
  S.settings=S.settings||{};
  // an empty sheet means the cloud copy hasn't landed yet — don't mark this done, or real data would never be sorted
  if(!seen) return;
  if(!n){ S.settings.catsV=2; save(); return; }
  window.ApexTime.snapshot('split Life into Health / People');
  touched.forEach(([w,k,g])=>{ w[k].c=g; });
  S.settings.catsV=2; save(); render();
  toast('Sorted '+n+' slot'+(n>1?'s':'')+' into Health / People — press Undo if you disagree');
}

// on load: only LOOK — never write. If meetings are missing from the grid, offer the import.
async function checkCal(){
  const t=new Date(); const from=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const r=await window.ApexTime.fillFromCalendar({from, to:addDays(from,1), dryRun:true});
  if(!r.ok){ $('calHint').innerHTML="Meetings can't be read right now — open the <a href=\"calendar.html\">Calendar tab</a> once to reconnect Google."; $('calHint').style.display='block'; return; }
  if(r.wouldFill){ $('calHint').innerHTML='You have '+(r.wouldFill/2)+' h of meetings today that aren\'t logged yet. <button onclick="importToday()">Log them</button> <span style="opacity:.7">— nothing is written until you press it.</span>'; $('calHint').style.display='block'; }
}
async function importToday(){
  const t=new Date(); const from=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const r=await window.ApexTime.fillFromCalendar({from, to:addDays(from,1)});
  reloadState(); render(); $('calHint').style.display='none';
  toast(r.filled? ('Logged '+(r.filled/2)+' h of meetings — press Undo if that was wrong') : 'Nothing to log');
}
function clearAutoWeek(){
  const n=window.ApexTime.clearAuto(new Date(monday), addDays(monday,7));
  reloadState(); render(); toast(n? ('Removed '+n+' calendar-filled slots'):'No calendar-filled slots this week');
}
function undoTime(){
  const snaps=window.ApexTime.snapshots();
  if(!snaps.length){ toast('Nothing to undo'); return; }
  if(window.ApexTime.restore()){ reloadState(); render(); toast('Reverted to '+new Date(snaps[0].ts).toLocaleTimeString()); }
}

/* ---------- navigation ---------- */
function shift(n){ monday=addDays(monday,7*n); render(); loadPlan(); }
function goToday(){ monday=mondayOf(new Date()); render(); scrollToNow(); loadPlan(); }
async function loadPlan(){
  if(S.settings&&S.settings.plan===false){ PLAN={}; render(); return; }
  try{ PLAN=await window.ApexTime.planSlots(new Date(monday), addDays(monday,7))||{}; }catch(e){ PLAN={}; }
  render();
}
function togglePlan(){
  S.settings=S.settings||{}; S.settings.plan=!(S.settings.plan!==false); save();
  const on=S.settings.plan!==false;
  $('planBtn').classList.toggle('on',on);
  toast(on?'Calendar layer on — planned slots show faintly':'Calendar layer off');
  if(on) loadPlan(); else { PLAN={}; render(); }
}
function scrollToNow(){ const td=tbody.querySelector('td.now'); if(td) td.scrollIntoView({block:'center'}); }
document.addEventListener('keydown',e=>{
  if(e.target.closest('[contenteditable],input,textarea')) return;
  if(e.key==='ArrowLeft') shift(-1); else if(e.key==='ArrowRight') shift(1); else if(e.key==='t'||e.key==='T') goToday();
});
// keep the "now" marker moving
setInterval(()=>{ const t=new Date(); if(iso(mondayOf(t))!==iso(monday)) return; const m=t.getHours()*60+t.getMinutes(); tbody.querySelectorAll('td.now').forEach(x=>x.classList.remove('now')); const r=Math.floor((m-START)/STEP); const d=(t.getDay()+6)%7; const td=tdAt(d,r); if(td) td.classList.add('now'); },60000);
// storage changes from sync
window.addEventListener('storage',e=>{ if(e.key===KEY && document.activeElement && !document.activeElement.closest('td.cell')){ try{ S=JSON.parse(localStorage.getItem(KEY))||S; S.weeks=S.weeks||{}; S.rules=S.rules||{}; render(); }catch(err){} } });

window.addEventListener('beforeunload',()=>{ const td=focused||tdOf(document.activeElement); if(td&&document.activeElement&&td.contains(document.activeElement)) commit(td); });
render(); scrollToNow();
setTimeout(checkCal,800);
loadPlan();
setTimeout(migrateCats,900);
</script>
