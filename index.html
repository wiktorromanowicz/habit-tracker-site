<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiktor-OS · Habits</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --panel2:#f5f6f8; --line:#e3e6eb;
    --text:#000000; --muted:#000000; --accent:#16a34a; --accent-dim:#dcfce7;
    --today:#2563eb;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:28px;min-height:100vh;overflow-x:hidden;}
  .wrap{max-width:860px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.2px;}
  .weekbar{display:flex;align-items:center;gap:10px;margin:18px 0 14px;}
  .weekbar .label{font-size:14px;color:var(--muted);min-width:210px;text-align:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;
    background:var(--panel2);color:var(--text);padding:7px 12px;font-size:13px;
    transition:background .15s,transform .05s;}
  button:hover{background:#eceef2;}
  button:active{transform:scale(.97);}
  .ghost{background:transparent;color:var(--muted);padding:7px 10px;}
  .nav{display:flex;gap:6px;margin-bottom:16px;}
  .nav a{text-decoration:none;font-size:13px;font-weight:500;color:var(--muted);
    background:var(--panel2);padding:7px 14px;border-radius:8px;border:1px solid var(--line);}
  .nav a.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  .nav a:not(.active):hover{background:#eceef2;}
  .brand{font-size:15px;font-weight:700;letter-spacing:.3px;margin-bottom:10px;color:var(--text);}
  .goalbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    background:linear-gradient(90deg,#a9741f,#d4a24a);color:#fff;padding:9px 15px;border-radius:10px;
    margin-bottom:14px;box-shadow:0 2px 10px rgba(169,116,31,.30);}
  .goalbar .gl{font-size:12px;font-weight:700;letter-spacing:.4px;opacity:.92;flex-shrink:0;}
  .goalbar .gt{flex:1;font-size:14px;font-weight:600;color:#fff;outline:none;min-height:20px;
    -webkit-user-select:text;user-select:text;}
  .goalbar .gt:empty:before{content:attr(data-ph);color:rgba(255,255,255,.65);font-weight:500;}
  .ghost:hover{background:#eef0f3;color:var(--text);}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  th,td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
  th:last-child,td:last-child{border-right:none;}
  tr:last-child td{border-bottom:none;}
  thead th{padding:12px 6px;font-size:12px;font-weight:500;color:var(--muted);background:var(--panel2);}
  thead th.today{color:var(--today);}
  th.habit-col,td.habit-col{text-align:left;padding:14px 14px;width:38%;}
  .hname{font-size:14px;font-weight:500;}
  .hmeta{font-size:11px;color:var(--muted);margin-top:3px;}
  .streak{color:var(--accent);}
  td.day{width:8.8%;height:52px;cursor:pointer;position:relative;}
  td.day:hover{background:var(--panel2);}
  .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
    margin:0 auto;display:flex;align-items:center;justify-content:center;
    transition:all .12s;}
  td.done .dot{background:var(--accent);border-color:var(--accent);}
  td.done .dot::after{content:"";width:6px;height:11px;border:solid #0f1115;
    border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-2px);}
  td.future{cursor:default;opacity:.4;}
  td.future:hover{background:transparent;}
  td.today-cell{background:rgba(59,130,246,.07);}
  .habit-actions{display:none;gap:6px;margin-top:8px;}
  td.habit-col:hover .habit-actions{display:flex;}
  .habit-actions button{padding:3px 8px;font-size:11px;background:transparent;color:var(--muted);}
  .habit-actions button:hover{color:var(--text);background:var(--panel2);}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px;color:var(--muted);}
  .add-row{margin-top:14px;}
  .add-row button{background:var(--accent-dim);color:var(--accent);}
  .add-row button:hover{background:#274d38;}
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:14px;}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:9999;}

  /* ---- Planner: yearly / monthly goals + bottlenecks ---- */
  .planner{margin-top:26px;display:flex;flex-direction:column;gap:16px;}
  .planner .toolbar{position:fixed;left:0;top:0;z-index:60;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin:0;flex-wrap:nowrap;
    box-shadow:0 6px 22px rgba(20,22,35,.16);opacity:0;pointer-events:none;
    transform:translate(-50%,-100%) scale(.96);transition:opacity .1s ease,transform .1s ease;}
  .planner .toolbar.show{opacity:1;pointer-events:auto;transform:translate(-50%,-100%) scale(1);}
  .block{background:var(--panel);border-radius:12px;padding:16px 18px 18px;border:1px solid var(--line);}
  .block-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .block-head h2{flex:1;font-size:15px;font-weight:600;margin:0;letter-spacing:.2px;}
  .block-head .ghost{padding:5px 9px;}
  .toolbar{display:flex;gap:4px;margin-left:auto;}
  .toolbar button{width:34px;height:30px;padding:0;font-size:14px;background:var(--panel2);
    color:var(--text);display:flex;align-items:center;justify-content:center;}
  .toolbar button:hover{background:#e6e8ec;}
  .toolbar .sep{width:1px;background:var(--line);margin:0 4px;}
  .editor{min-height:48px;height:220px;max-height:80vh;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;padding:16px 18px;font-size:14px;line-height:1.7;color:var(--text);
    outline:none;-webkit-user-select:text;user-select:text;overflow-wrap:anywhere;
    resize:vertical;overflow:auto;}
  .editor:focus{border-color:#b8bec9;}
  .editor:empty:before{content:attr(data-ph);color:#8b94a7;}
  .toolbar .swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);padding:0;}
  .toolbar .swatch:hover{border-color:#9aa1ad;}
  .toolbar input[type=color]{width:32px;height:30px;padding:2px;border:none;border-radius:8px;
    background:var(--panel2);cursor:pointer;}
  .editor h3{font-size:15px;margin:14px 0 6px;color:var(--text);}
  .editor ul,.editor ol{margin:6px 0 6px 4px;padding-left:22px;}
  .editor li{margin:3px 0;}
  .editor a{color:var(--today);}

  /* ---- Spreadsheet-style habit sheet (full-width month view) ---- */
  .sheet{background:#fbf9f4;border-top:1px solid #e7e2d6;border-bottom:1px solid #e7e2d6;
    box-shadow:0 1px 3px rgba(60,50,30,.06);
    position:relative;left:50%;right:50%;width:100vw;margin-left:-50vw;margin-right:-50vw;}
  .sheet-inner{max-width:1500px;margin:0 auto;padding:0 clamp(16px,4vw,40px);}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:22px 0 16px;flex-wrap:wrap;}
  .sheet-eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;color:#a99f8c;text-transform:uppercase;}
  .sheet-title{font-size:28px;font-weight:700;letter-spacing:-.01em;margin-top:2px;color:#2b2a26;}
  .sheet-sub{font-size:12px;color:#9c9484;margin-top:4px;}
  .periodtabs{display:flex;gap:6px;flex-wrap:wrap;}
  .ptab{font-size:13px;font-weight:500;padding:7px 14px;border-radius:20px;border:1px solid #e0dacb;
    background:#fff;color:#4a463d;cursor:pointer;}
  .ptab:hover{background:#f3efe4;}
  .ptab.dark{background:#2b2a26;color:#fff;border-color:#2b2a26;}
  .ptab.dark:hover{background:#3a382f;}
  .sheet-scroll{overflow-x:auto;padding-bottom:2px;}
  .sheet table{width:100%;border-collapse:collapse;background:transparent;border:none;border-radius:0;
    table-layout:fixed;min-width:1160px;}
  .sheet thead th{background:#f3efe4;border-bottom:1px solid #e2dccd;border-right:1px solid #ece7da;
    padding:7px 2px;font-weight:600;color:#8c8474;}
  .sheet thead th:last-child{border-right:none;}
  .sheet .dnum{display:block;font-size:13px;font-weight:700;color:#6b6355;line-height:1.1;}
  .sheet .dwd{display:block;font-size:9px;font-weight:600;color:#b3ab99;}
  .sheet thead th.today .dnum{color:#b4802a;}
  .sheet th.habit-col,.sheet td.habit-col{text-align:left;padding:12px 16px;width:180px;background:transparent;}
  .sheet th.habit-col{text-transform:uppercase;font-size:11px;letter-spacing:.04em;}
  .sheet tbody td{border-bottom:1px solid #efeadd;border-right:1px solid #f3eee2;}
  .sheet tbody td:last-child{border-right:none;}
  .sheet tbody tr:nth-child(even){background:#f8f5ee;}
  .sheet tbody tr:hover{background:#f3efe3;}
  .sheet tbody tr:last-child td{border-bottom:none;}
  .sheet th.wend,.sheet td.wend{background:#f6f1e6;}
  .sheet tbody tr:nth-child(even) td.wend{background:#f2ecde;}
  .sheet td.day{height:38px;cursor:pointer;padding:0;}
  .sheet td.day:hover{background:#ece5d5;}
  .sheet td.today-cell{background:rgba(180,128,42,.12)!important;}
  .sheet .hname{font-weight:600;color:#2b2a26;font-size:15px;}
  .sheet .hmeta{color:#a99f8c;font-size:12px;}
  .sheet .dot{width:15px;height:15px;border:1.5px solid #d4ccbb;}
  .sheet td.done .dot::after{width:4px;height:7px;transform:rotate(45deg) translate(-1px,-1px);}
  .sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:13px 0 20px;font-size:13px;color:#9c9484;flex-wrap:wrap;}

  /* ---- Task board (Google Tasks style) ---- */
  .tasks-wrap{margin-top:28px;}
  .tasks-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .tasks-head h2{flex:1;font-size:16px;font-weight:600;margin:0;letter-spacing:.2px;}
  .tasks-board{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;align-items:flex-start;}
  .tlist{flex:0 0 320px;max-width:320px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:14px 8px 10px;box-shadow:0 1px 3px rgba(20,22,35,.05);}
  .tlist-head{display:flex;align-items:center;gap:4px;padding:0 4px 8px;}
  .tlist-caret{background:transparent;color:#9aa1ad;padding:2px 5px;font-size:12px;line-height:1;
    border-radius:6px;flex-shrink:0;transition:transform .15s;}
  .tlist-caret:hover{background:var(--panel2);color:var(--text);}
  .tlist.collapsed .tlist-caret{transform:rotate(-90deg);}
  .tlist.collapsed{padding-bottom:14px;}
  .tlist.collapsed .tlist-head{padding-bottom:0;}
  .tlist-title{flex:1;font-size:15px;font-weight:600;color:var(--text);outline:none;
    -webkit-user-select:text;user-select:text;border-radius:6px;padding:2px 4px;min-height:22px;}
  .tlist-title:focus{background:var(--panel2);}
  .tlist-count{font-size:12px;font-weight:600;color:#9aa1ad;min-width:14px;text-align:center;flex-shrink:0;}
  .tlist-menu{background:transparent;color:#9aa1ad;padding:3px 7px;font-size:16px;line-height:1;border-radius:6px;flex-shrink:0;}
  .tlist-menu:hover{background:var(--panel2);color:var(--text);}
  .tadd{display:flex;align-items:center;gap:9px;padding:7px 10px;color:var(--accent);
    font-size:14px;font-weight:500;cursor:pointer;border-radius:8px;}
  .tadd:hover{background:var(--accent-dim);}
  .tadd .plus{font-size:18px;line-height:1;font-weight:600;}
  .titems{list-style:none;margin:2px 0 0;padding:0;min-height:8px;}
  .titems.dragover{background:var(--accent-dim);border-radius:8px;}
  .titem{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;
    cursor:grab;position:relative;transition:background .1s;}
  .titem:hover{background:var(--panel2);}
  .titem.dragging{opacity:.4;}
  .titem.drop-before::before,.titem.drop-after::after{content:"";position:absolute;left:10px;right:10px;
    height:2px;background:var(--accent);border-radius:2px;}
  .titem.drop-before::before{top:-1px;}
  .titem.drop-after::after{bottom:-1px;}
  .tcheck{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:1.6px solid #c3cad6;
    margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:all .12s;background:#fff;}
  .tcheck:hover{border-color:var(--accent);}
  .titem.done .tcheck{background:var(--accent);border-color:var(--accent);}
  .titem.done .tcheck::after{content:"";width:5px;height:9px;border:solid #fff;
    border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px);}
  .titem.sub{padding-left:34px;}
  .titem.sub::before{content:"";position:absolute;left:20px;top:15px;width:8px;height:1.5px;background:#cbd2dd;}
  .ttext{flex:1;font-size:14px;line-height:1.4;color:var(--text);outline:none;word-break:break-word;
    -webkit-user-select:text;user-select:text;padding-top:1px;}
  .titem.sub .ttext{font-size:13.5px;}
  .titem.done .ttext{color:#9aa1ad;text-decoration:line-through;}
  .ttext:empty:before{content:"New task";color:#b0b7c3;}
  .titem-actions{flex-shrink:0;display:flex;align-items:center;gap:1px;opacity:0;transition:opacity .1s;}
  .titem:hover .titem-actions{opacity:1;}
  .tind{background:transparent;color:#b3bac6;padding:2px 5px;font-size:13px;line-height:1;border-radius:6px;}
  .tind:hover{color:var(--text);background:var(--panel2);}
  .tdel{background:transparent;color:#c3cad6;padding:2px 5px;font-size:15px;line-height:1;border-radius:6px;}
  .tdel:hover{color:#ef4444;background:transparent;}
  .tcompleted-head{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;color:var(--muted);
    font-size:13px;font-weight:500;cursor:pointer;border-radius:8px;}
  .tcompleted-head:hover{background:var(--panel2);}
  .tcompleted-head .caret{transition:transform .15s;font-size:11px;}
  .tlist.collapsed-done .tcompleted-head .caret{transform:rotate(-90deg);}
  .tlist.collapsed-done .titems.done-items{display:none;}
  .tlist-add{background:var(--accent-dim);color:var(--accent);font-size:13px;font-weight:500;
    padding:8px 14px;border-radius:10px;}
  .tlist-add:hover{background:#cdeed7;}
  .tmenu-pop{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 26px rgba(20,22,35,.18);padding:5px;min-width:150px;}
  .tmenu-pop button{display:block;width:100%;text-align:left;background:transparent;color:var(--text);
    padding:8px 12px;font-size:13px;border-radius:7px;}
  .tmenu-pop button:hover{background:var(--panel2);}
  .tmenu-pop button.danger:hover{background:#fdeaea;color:#ef4444;}
</style>
<script defer src="pwa.js"></script>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="goalbar">
    <span class="gl">🎯 FOCUS</span>
    <div class="gt" id="focusBar" contenteditable="true" spellcheck="true" data-ph="Set your #1 goal — pinned here at all times"></div>
  </div>
  <div class="brand">⚡ Wiktor-OS</div>
  <nav class="nav">
    <a href="index.html" class="active">🎯 Habits</a>
    <a href="finances.html">💰 Net worth</a>
    <a href="metrics.html">📊 Metrics</a>
    <a href="assets.html">🗂️ Assets</a>
    <a href="ideas.html">💡 Ideas</a>
  </nav>

  <section class="tasks-wrap">
    <div class="tasks-head">
      <h2>Tasks</h2>
      <button class="tlist-add" onclick="addList()">+ New list</button>
    </div>
    <div class="tasks-board" id="tasksBoard"></div>
  </section>

  <div class="sheet">
    <div class="sheet-inner">
      <div class="sheet-head">
        <div>
          <div class="sheet-eyebrow">Habits · Monthly view</div>
          <div class="sheet-title" id="weekLabel"></div>
          <div class="sheet-sub" id="weekInfo"></div>
        </div>
        <div class="periodtabs">
          <button class="ptab" onclick="shiftTrackMonth(-1)">‹ Prev</button>
          <button class="ptab dark" onclick="thisTrackMonth()">This month</button>
          <button class="ptab" onclick="shiftTrackMonth(1)">Next ›</button>
        </div>
      </div>
      <div class="sheet-scroll">
        <table>
          <thead><tr id="headRow"></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
      <div class="sheet-foot">
        <span id="weekStat"></span>
        <button class="ptab" onclick="addHabit()">+ Add habit</button>
      </div>
    </div>
  </div>

  <section class="planner">
    <div class="toolbar" id="toolbar">
      <button onmousedown="fmt(event,'formatBlock','h3')" title="Heading">H</button>
      <button onmousedown="fmt(event,'bold')" title="Bold"><b>B</b></button>
      <button onmousedown="fmt(event,'italic')" title="Italic"><i>I</i></button>
      <button onmousedown="fmt(event,'strikeThrough')" title="Strikethrough"><s>S</s></button>
      <span class="sep"></span>
      <button onmousedown="fmt(event,'insertUnorderedList')" title="Bulleted list">•</button>
      <button onmousedown="fmt(event,'insertOrderedList')" title="Numbered list">1.</button>
      <span class="sep"></span>
      <button class="swatch" style="background:#000000" onmousedown="fmtColor(event,'#000000')" title="Black"></button>
      <button class="swatch" style="background:#4ade80" onmousedown="fmtColor(event,'#4ade80')" title="Green"></button>
      <button class="swatch" style="background:#3b82f6" onmousedown="fmtColor(event,'#3b82f6')" title="Blue"></button>
      <button class="swatch" style="background:#f59e0b" onmousedown="fmtColor(event,'#f59e0b')" title="Amber"></button>
      <button class="swatch" style="background:#ef4444" onmousedown="fmtColor(event,'#ef4444')" title="Red"></button>
      <button class="swatch" style="background:#a855f7" onmousedown="fmtColor(event,'#a855f7')" title="Purple"></button>
      <input type="color" title="Custom color" onmousedown="rememberSel()" oninput="fmtColorCustom(this.value)">
      <span class="sep"></span>
      <button onmousedown="fmt(event,'removeFormat')" title="Clear formatting">⌫</button>
    </div>

    <div class="block">
      <div class="block-head">
        <h2>Current bottlenecks</h2>
      </div>
      <div id="bottleEditor" class="editor" contenteditable="true" spellcheck="true"></div>
    </div>

    <div class="block">
      <div class="block-head">
        <h2 id="monthLabel">Monthly goals</h2>
        <button class="ghost" onclick="shiftMonth(-1)">‹</button>
        <button class="ghost" onclick="shiftMonth(1)">›</button>
        <button class="ghost" onclick="thisMonth()">Today</button>
      </div>
      <div id="goalEditor" class="editor" contenteditable="true" spellcheck="true"></div>
    </div>

    <div class="block">
      <div class="block-head">
        <h2 id="yearLabel">Yearly goals</h2>
        <button class="ghost" onclick="shiftYear(-1)">‹</button>
        <button class="ghost" onclick="shiftYear(1)">›</button>
      </div>
      <div id="yearEditor" class="editor" contenteditable="true" spellcheck="true"></div>
    </div>
  </section>
</div>

<script>
const KEY = "titan_habits_v1";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

let state = load() || {
  habits: [
    { id: uid(), name: "100 min of marketing", target: "100 min/day", done: {} }
  ]
};

// migrate: ensure done object exists
state.habits.forEach(h => h.done = h.done || {});
state.goals = state.goals || {};   // { "2026-08": "<html>" }

// Task board seed data (matches the "This week" / "Next" layout from the screenshot)
const TASK_SEED = {
  "This week": [
    "Post about referral contest",
    "DMs for 1 hour",
    "Cleaning SOP database template for 20 min to send to CFO of 7th",
    "Review of their funnel for Ryan for 20 min",
    "Put better customer journey to Jira",
    "Planning my week for 30 min",
    "Writing a new YouTube video about Hormozi's advice for refunds",
    "Do hiring tasks for 30 min",
    "Agreement for Alex",
    "Sending money to dad for mum's phone",
    "Work on hiring a support person",
    "Incentive structure for the CSMs of Raj",
    "Booking an endocrinologist",
  ],
  "Next": [
    "Working on Sandy's visa situation",
    "Watch videos on how to run B2B ads",
    "Watch how to run the recruiting ACQ side",
    "Work on AI for 30 min",
    "Finding a CSM for front end simplifed",
    "Setup TrustPilot after onboarding call system",
  ],
};
function seedItems(names){ return names.map(t => ({ id: uid(), text: t, done: false, parent: null })); }

if(!state.taskLists){
  state.taskLists = Object.keys(TASK_SEED).map(name =>
    ({ id: uid(), name, collapsed: false, items: seedItems(TASK_SEED[name]) }));
}
// migrate older saved lists: ensure flags exist, and backfill the seed into
// still-empty default lists (so earlier empty "This week"/"Next" get populated once).
state.taskLists.forEach(l => {
  if(l.collapsed === undefined) l.collapsed = false;
  if((!l.items || l.items.length === 0) && !l._seeded && TASK_SEED[l.name]){
    l.items = seedItems(TASK_SEED[l.name]);
    l._seeded = true;
  }
  l.items.forEach(i => { if(i.parent === undefined) i.parent = null; });
});

function firstOfMonth(d){ const x=new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x; }
let trackMonth = firstOfMonth(new Date());

function uid(){ return Math.random().toString(36).slice(2,9); }
function mondayOf(d){
  d = new Date(d); const day = (d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d;
}
function iso(d){ return d.toISOString().slice(0,10); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDay(a,b){ return iso(a)===iso(b); }

function shiftTrackMonth(n){ trackMonth.setMonth(trackMonth.getMonth()+n); render(); }
function thisTrackMonth(){ trackMonth = firstOfMonth(new Date()); render(); }

function currentStreak(h){
  let s=0, d=new Date(); d.setHours(0,0,0,0);
  // if today not done, start from yesterday so an untouched today doesn't break streak
  if(!h.done[iso(d)]) d = addDays(d,-1);
  while(h.done[iso(d)]){ s++; d = addDays(d,-1); }
  return s;
}

function toggle(hid, dstr, isFuture, ev){
  if(isFuture) return;
  const h = state.habits.find(x=>x.id===hid);
  if(h.done[dstr]){ delete h.done[dstr]; }
  else { h.done[dstr]=true; fireworks(ev); }
  save(); render();
}

/* ---- fireworks / confetti burst on completion ---- */
const fxCanvas = document.getElementById("fx");
const fxCtx = fxCanvas.getContext("2d");
let fxParts = [], fxRunning = false;
function fxResize(){ fxCanvas.width=innerWidth; fxCanvas.height=innerHeight; }
addEventListener("resize", fxResize); fxResize();

function fireworks(ev){
  let x = innerWidth/2, y = innerHeight/2;
  if(ev){ x = ev.clientX; y = ev.clientY; }
  const colors = ["#4ade80","#3b82f6","#f59e0b","#ef4444","#a855f7","#ec4899","#eab308"];
  const n = 46;
  for(let i=0;i<n;i++){
    const a = (Math.PI*2*i)/n + Math.random()*0.4;
    const sp = 3 + Math.random()*6;
    fxParts.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2,
      life: 1, size: 3+Math.random()*4,
      color: colors[(Math.random()*colors.length)|0],
      rot: Math.random()*6.28, vr:(Math.random()-.5)*.4
    });
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(fxTick); }
}
function fxTick(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  fxParts.forEach(p=>{
    p.vy += 0.15; p.vx *= 0.99; p.x += p.vx; p.y += p.vy;
    p.life -= 0.012; p.rot += p.vr;
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0,p.life);
    fxCtx.translate(p.x,p.y); fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.color;
    fxCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6);
    fxCtx.restore();
  });
  fxParts = fxParts.filter(p=>p.life>0 && p.y<fxCanvas.height+40);
  if(fxParts.length){ requestAnimationFrame(fxTick); }
  else { fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height); fxRunning=false; }
}

function render(){
  const today = new Date(); today.setHours(0,0,0,0);
  const year = trackMonth.getFullYear(), month = trackMonth.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const WD = ["S","M","T","W","T","F","S"];
  document.getElementById("weekLabel").textContent =
    trackMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"});

  // header — one column per day of the month
  let head = '<th class="habit-col">Habit</th>';
  for(let i=1;i<=daysInMonth;i++){
    const date = new Date(year,month,i);
    const isT = sameDay(date,today);
    const we = (date.getDay()===0 || date.getDay()===6);
    head += `<th class="${isT?'today':''} ${we?'wend':''}"><span class="dnum">${i}</span><span class="dwd">${WD[date.getDay()]}</span></th>`;
  }
  document.getElementById("headRow").innerHTML = head;

  // body
  const body = document.getElementById("body");
  if(state.habits.length===0){
    body.innerHTML = `<tr><td colspan="${daysInMonth+1}" class="empty">No habits yet. Click “+ Add habit”.</td></tr>`;
  } else {
    body.innerHTML = state.habits.map(h=>{
      const streak = currentStreak(h);
      let row = `<td class="habit-col">
        <div class="hname">${escapeHtml(h.name)}</div>
        <div class="hmeta">${h.target?escapeHtml(h.target):""}${h.target&&streak>0?" · ":""}${streak>0?`<span class="streak">🔥 ${streak}d</span>`:(h.target?"":"no streak")}</div>
        <div class="habit-actions">
          <button onclick="editHabit('${h.id}')">Edit</button>
          <button onclick="delHabit('${h.id}')">Delete</button>
        </div>
      </td>`;
      for(let i=1;i<=daysInMonth;i++){
        const date = new Date(year,month,i);
        const dstr = iso(date);
        const future = date>today;
        const done = !!h.done[dstr];
        const isT = sameDay(date,today);
        const we = (date.getDay()===0 || date.getDay()===6);
        row += `<td class="day ${done?'done':''} ${future?'future':''} ${isT?'today-cell':''} ${we?'wend':''}"
                  onclick="toggle('${h.id}','${dstr}',${future},event)"><div class="dot"></div></td>`;
      }
      return `<tr>${row}</tr>`;
    }).join("");
  }

  // month stat
  let cells=0, filled=0;
  state.habits.forEach(h=>{
    for(let i=1;i<=daysInMonth;i++){
      const date=new Date(year,month,i);
      if(date>today) continue;
      cells++; if(h.done[iso(date)]) filled++;
    }
  });
  const pct = cells? Math.round(filled/cells*100):0;
  document.getElementById("weekStat").textContent =
    `This month: ${filled}/${cells} done (${pct}%)`;
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---- remember each box's manually-resized height ---- */
state.editorSizes = state.editorSizes || {};
(function persistResize(){
  // restore any saved heights on load
  editorSaves.forEach((_, el)=>{
    const h = state.editorSizes[el.id];
    if(h) el.style.height = h + "px";
  });
  // read the current inline heights and persist any that changed
  function saveSizes(){
    let changed = false;
    editorSaves.forEach((_, el)=>{
      if(el.style.height){
        const h = parseInt(el.style.height, 10);
        if(h && state.editorSizes[el.id] !== h){ state.editorSizes[el.id] = h; changed = true; }
      }
    });
    if(changed) save();
  }
  // a resize drag ends with a mouse/pointer release — the reliable trigger
  editorSaves.forEach((_, el)=>{
    el.addEventListener("mouseup", ()=> setTimeout(saveSizes, 50));
    el.addEventListener("pointerup", ()=> setTimeout(saveSizes, 50));
  });
  window.addEventListener("mouseup", ()=> setTimeout(saveSizes, 50));
  window.addEventListener("pointerup", ()=> setTimeout(saveSizes, 50));
  // ResizeObserver as a backup (fires while the tab is focused)
  if(window.ResizeObserver){
    let t;
    const ro = new ResizeObserver(()=>{ clearTimeout(t); t = setTimeout(saveSizes, 300); });
    editorSaves.forEach((_, el)=> ro.observe(el));
  }
})();

/* ---- floating toolbar: only show while text is selected inside an editor ---- */
(function selectionToolbar(){
  const bar = document.getElementById("toolbar");
  function selInEditor(){
    const s = window.getSelection();
    if(!s || s.rangeCount===0 || s.isCollapsed) return null;
    for(const el of editorSaves.keys()){
      if(el.contains(s.anchorNode) && el.contains(s.focusNode)) return el;
    }
    return null;
  }
  function updateBar(){
    const el = selInEditor();
    if(!el){ bar.classList.remove("show"); return; }
    activeEditor = el;
    const r = window.getSelection().getRangeAt(0).getBoundingClientRect();
    if(r.width===0 && r.height===0){ bar.classList.remove("show"); return; }
    bar.style.left = Math.round(r.left + r.width/2) + "px";
    bar.style.top  = Math.max(44, Math.round(r.top - 10)) + "px";
    bar.classList.add("show");
  }
  document.addEventListener("selectionchange", ()=> requestAnimationFrame(updateBar));
  document.addEventListener("scroll", ()=>{ if(bar.classList.contains("show")) updateBar(); }, true);
  window.addEventListener("resize", ()=>{ if(bar.classList.contains("show")) updateBar(); });

  /* list shortcuts: Cmd/Ctrl+8 = bullets, Cmd/Ctrl+7 = numbered */
  editorSaves.forEach((saveFn, el)=>{
    el.addEventListener("keydown", (e)=>{
      if(!(e.metaKey || e.ctrlKey) || e.altKey) return;
      const bullets = (e.key==="8" || e.code==="Digit8");
      const numbers = (e.key==="7" || e.code==="Digit7");
      if(bullets || numbers){
        e.preventDefault();
        activeEditor = el;
        document.execCommand(bullets ? "insertUnorderedList" : "insertOrderedList");
        saveFn();
      }
    });
  });
})();

function isoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  return 1 + Math.round((d-firstThursday)/(7*86400000));
}
function updateWeekInfo(){
  const now = new Date();
  const endYear = new Date(now.getFullYear(),11,31,23,59,59);
  const weeksLeft = Math.max(0, Math.ceil((endYear-now)/(7*86400000)));
  document.getElementById("weekInfo").textContent =
    `Week ${isoWeek(now)} · ${weeksLeft} weeks left in ${now.getFullYear()}`;
}

function findItem(listId, itemId){

function childrenOf(list, parentId){ return list.items.filter(i => i.parent === parentId); }

    });
    wireListDrop(ul, list.id, false);
    col.appendChild(ul);

    // completed section (parents whose done, plus done subtasks nested)
    const doneTop = childrenOf(list, null).filter(i => i.done);
    const doneSubsOfActive = [];
    childrenOf(list, null).filter(i => !i.done).forEach(top => {
      childrenOf(list, top.id).filter(s => s.done).forEach(s => doneSubsOfActive.push({top, s}));
    });
    const doneCount = doneTop.reduce((n,t)=> n + 1 + childrenOf(list,t.id).length, 0) + doneSubsOfActive.length;
    if(doneCount){
      const ch = document.createElement("div");
      ch.className = "tcompleted-head";
      ch.innerHTML = '<span class="caret">▾</span><span>Completed (' + doneCount + ')</span>';
      ch.addEventListener("click", () => { list.collapsedDone = !list.collapsedDone; save(); renderTasks(); });
      col.appendChild(ch);

      const dul = document.createElement("ul");
      dul.className = "titems done-items"; dul.dataset.list = list.id;
      // done subtasks that still belong to an active parent
      doneSubsOfActive.forEach(({s}) => dul.appendChild(taskRow(list.id, s, true)));
      // fully-done parents with their subtasks
      doneTop.forEach(top => {
        dul.appendChild(taskRow(list.id, top, false));
        childrenOf(list, top.id).forEach(sub => dul.appendChild(taskRow(list.id, sub, true)));
      });
      wireListDrop(dul, list.id, true);
      col.appendChild(dul);
    }

    board.appendChild(col);
  });

function taskRow(listId, it, isSub){
  const li = document.createElement("li");
  li.className = "titem" + (it.done ? " done" : "") + (isSub ? " sub" : "");
  li.draggable = true;
  li.dataset.list = listId;
  li.dataset.item = it.id;

  const check = document.createElement("div");
  check.className = "tcheck";
  check.title = it.done ? "Mark not done" : "Mark done";
  check.addEventListener("click", e => { e.stopPropagation(); toggleTask(listId, it.id); });

  const txt = document.createElement("div");
  txt.className = "ttext";
  txt.contentEditable = "true"; txt.spellcheck = false;
  txt.textContent = it.text;
  txt.addEventListener("blur", e => {
    const v = e.target.textContent.trim();
    if(!v){ deleteTask(listId, it.id); return; }
    it.text = v; save();
  });
  txt.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); e.target.blur(); addTask(listId); }
    else if(e.key === "Tab" && !e.shiftKey){ e.preventDefault(); indentTask(listId, it.id, e.target); }
    else if(e.key === "Tab" && e.shiftKey){ e.preventDefault(); outdentTask(listId, it.id, e.target); }
  });
  txt.addEventListener("mousedown", () => { li.draggable = false; });
  txt.addEventListener("blur", () => { li.draggable = true; });

  const actions = document.createElement("div");
  actions.className = "titem-actions";
  const indentBtn = document.createElement("button");
  indentBtn.className = "tind"; indentBtn.textContent = "⇥"; indentBtn.title = "Make subtask (Tab)";
  indentBtn.addEventListener("click", e => { e.stopPropagation(); indentTask(listId, it.id); });
  const outdentBtn = document.createElement("button");
  outdentBtn.className = "tind"; outdentBtn.textContent = "⇤"; outdentBtn.title = "Promote (Shift+Tab)";
  outdentBtn.addEventListener("click", e => { e.stopPropagation(); outdentTask(listId, it.id); });
  const del = document.createElement("button");
  del.className = "tdel"; del.textContent = "✕"; del.title = "Delete task";
  del.addEventListener("click", e => { e.stopPropagation(); deleteTask(listId, it.id); });
  if(isSub) actions.appendChild(outdentBtn); else actions.appendChild(indentBtn);
  actions.appendChild(del);

  li.appendChild(check); li.appendChild(txt); li.appendChild(actions);
  wireItemDrag(li);
  return li;
}

/* ---- mutations ---- */
function addTask(listId){
  const l = findList(listId); if(!l) return;
  const it = { id: uid(), text: "", done: false, parent: null };
  const firstDone = l.items.findIndex(i => i.done);
  if(firstDone === -1) l.items.push(it); else l.items.splice(firstDone, 0, it);
  save(); renderTasks();
  const el = board.querySelector('[data-item="'+it.id+'"] .ttext');
  if(el) el.focus();
}
function toggleTask(listId, itemId){
  const it = findItem(listId, itemId); if(!it) return;
  const l = findList(listId);
  it.done = !it.done;
  // completing a parent completes its subtasks too
  if(it.parent === null) childrenOf(l, it.id).forEach(s => s.done = it.done);
  save(); renderTasks();
}
function deleteTask(listId, itemId){
  const l = findList(listId); if(!l) return;
  // deleting a parent deletes its subtasks
  l.items = l.items.filter(i => i.id !== itemId && i.parent !== itemId);
  save(); renderTasks();
}
function indentTask(listId, itemId, focusEl){
  const l = findList(listId); if(!l) return;
  const it = findItem(listId, itemId); if(!it || it.parent !== null) return; // only one level deep
  // parent = nearest top-level task above it (of the same done-state group order in array)
  const idx = l.items.findIndex(i => i.id === itemId);
  let parent = null;
  for(let k = idx - 1; k >= 0; k--){ if(l.items[k].parent === null){ parent = l.items[k]; break; } }
  if(!parent) return; // nothing above to nest under
  if(childrenOf(l, it.id).length) return; // don't nest a task that itself has children
  it.parent = parent.id;
  it.done = parent.done;
  // move it to sit right after the parent's existing children
  l.items = l.items.filter(i => i.id !== itemId);
  let insertAt = l.items.findIndex(i => i.id === parent.id) + 1;
  while(insertAt < l.items.length && l.items[insertAt].parent === parent.id) insertAt++;
  l.items.splice(insertAt, 0, it);
  save(); renderTasks();
  refocus(itemId);
}
function outdentTask(listId, itemId){
  const l = findList(listId); if(!l) return;
  const it = findItem(listId, itemId); if(!it || it.parent === null) return;
  const oldParent = it.parent;
  it.parent = null;
  // move it just after the last of its former parent's remaining subtasks
  l.items = l.items.filter(i => i.id !== itemId);
  let insertAt = l.items.findIndex(i => i.id === oldParent) + 1;
  while(insertAt < l.items.length && l.items[insertAt].parent === oldParent) insertAt++;
  l.items.splice(insertAt, 0, it);
  save(); renderTasks();
  refocus(itemId);
}
function refocus(itemId){
  const el = board.querySelector('[data-item="'+itemId+'"] .ttext');
  if(el){ el.focus();
    try{ const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); }catch(_){}
  }
}
function addList(){
  state.taskLists.push({ id: uid(), name: "New list", collapsed: false, items: [] });
  save(); renderTasks();
  const cols = board.querySelectorAll(".tlist-title");
  const last = cols[cols.length-1];
  if(last){ last.focus();
    const r = document.createRange(); r.selectNodeContents(last);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
}
function deleteList(listId){
  if(state.taskLists.length <= 1){ alert("Keep at least one list."); return; }
  state.taskLists = state.taskLists.filter(l => l.id !== listId);
  save(); renderTasks();
}
function clearCompleted(listId){
  const l = findList(listId); if(!l) return;
  l.items = l.items.filter(i => !i.done);
  // any subtask whose parent was cleared becomes top-level
  const ids = new Set(l.items.map(i => i.id));
  l.items.forEach(i => { if(i.parent && !ids.has(i.parent)) i.parent = null; });
  save(); renderTasks();
}

/* ---- list options menu ---- */
let openMenuEl = null;
function closeListMenu(){ if(openMenuEl){ openMenuEl.remove(); openMenuEl = null; } }
document.addEventListener("click", e => {
  if(openMenuEl && !openMenuEl.contains(e.target) && !e.target.classList.contains("tlist-menu")) closeListMenu();
});
function openListMenu(e, listId){
  e.stopPropagation();
  closeListMenu();
  const l = findList(listId);
  const pop = document.createElement("div");
  pop.className = "tmenu-pop";
  pop.innerHTML =
    '<button data-a="hide">' + (l.collapsed ? "Show list" : "Hide list") + '</button>' +
    '<button data-a="clear">Clear completed</button>' +
    '<button data-a="del" class="danger">Delete list</button>';
  pop.querySelector('[data-a="hide"]').addEventListener("click", () => { l.collapsed = !l.collapsed; save(); renderTasks(); closeListMenu(); });
  pop.querySelector('[data-a="clear"]').addEventListener("click", () => { clearCompleted(listId); closeListMenu(); });
  pop.querySelector('[data-a="del"]').addEventListener("click", () => { deleteList(listId); closeListMenu(); });
  document.body.appendChild(pop);
  const r = e.target.getBoundingClientRect();
  pop.style.top = (r.bottom + 4) + "px";
  pop.style.left = Math.min(r.left, window.innerWidth - 170) + "px";
  openMenuEl = pop;
}

/* ================= Drag & drop ================= */
let dragItem = null;   // {listId, itemId}

function wireItemDrag(li){
  li.addEventListener("dragstart", e => {
    dragItem = { listId: li.dataset.list, itemId: li.dataset.item };
    li.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", li.dataset.item); }catch(_){}
  });
  li.addEventListener("dragend", () => {
    li.classList.remove("dragging");
    board.querySelectorAll(".drop-before,.drop-after").forEach(x => x.classList.remove("drop-before","drop-after"));
    board.querySelectorAll(".dragover").forEach(x => x.classList.remove("dragover"));
    dragItem = null;
  });
  li.addEventListener("dragover", e => {
    e.preventDefault();
    if(!dragItem) return;
    const rect = li.getBoundingClientRect();
    const after = e.clientY > rect.top + rect.height/2;
    li.classList.toggle("drop-after", after);
    li.classList.toggle("drop-before", !after);
  });
  li.addEventListener("dragleave", () => li.classList.remove("drop-before","drop-after"));
  li.addEventListener("drop", e => {
    e.preventDefault(); e.stopPropagation();
    if(!dragItem) return;
    const rect = li.getBoundingClientRect();
    const after = e.clientY > rect.top + rect.height/2;
    moveItem(dragItem, li.dataset.list, li.dataset.item, after);
  });
}

function wireListDrop(ul, listId, doneZone){
  ul.addEventListener("dragover", e => { e.preventDefault(); if(dragItem) ul.classList.add("dragover"); });
  ul.addEventListener("dragleave", e => { if(!ul.contains(e.relatedTarget)) ul.classList.remove("dragover"); });
  ul.addEventListener("drop", e => {
    e.preventDefault(); ul.classList.remove("dragover");
    if(!dragItem) return;
    moveItem(dragItem, listId, null, true, doneZone);
  });
}

// move a task (and its subtasks) to a new position / list
function moveItem(src, destListId, destItemId, after, doneZone){
  const srcList = findList(src.listId);
  const destList = findList(destListId);
  if(!srcList || !destList) return;
  if(src.itemId === destItemId) return;

  const moved = srcList.items.find(i => i.id === src.itemId);
  if(!moved) return;
  // block dropping a parent onto its own subtree
  const target = destItemId ? destList.items.find(i => i.id === destItemId) : null;
  if(target && target.parent === moved.id) { /* dropping a parent right by its child: allow, handled below */ }

  // gather the moved task with its subtasks (contiguous block)
  const subs = moved.parent === null ? childrenOf(srcList, moved.id) : [];
  const blockIds = new Set([moved.id, ...subs.map(s => s.id)]);
  const block = srcList.items.filter(i => blockIds.has(i.id));
  srcList.items = srcList.items.filter(i => !blockIds.has(i.id));

  // decide done-state + parent for the moved (top) item
  if(target){
    moved.done = target.done;
    // if dropping onto a subtask, become a sibling subtask under the same parent (only if moved has no children)
    moved.parent = (target.parent && subs.length === 0) ? target.parent : null;
  } else if(typeof doneZone === "boolean"){
    moved.done = doneZone; moved.parent = null;
  }
  if(moved.parent !== null){ subs.length = 0; } // a subtask can't carry children
  block.forEach(b => { if(b.id !== moved.id) b.done = moved.done; });

  // compute insert index in destList
  let insertAt;
  if(destItemId){
    const di = destList.items.findIndex(i => i.id === destItemId);
    insertAt = after ? di + 1 : di;
    // if landing right after a parent that has children, skip past them to keep groups intact
  } else {
    if(moved.done) insertAt = destList.items.length;
    else { const fd = destList.items.findIndex(i => i.done); insertAt = fd === -1 ? destList.items.length : fd; }
  }
  destList.items.splice(insertAt, 0, ...block);
  save(); renderTasks();
}

renderTasks();

/* ---- sticky focus bar (shared across pages) ---- */
(function focusBar(){
  const el=document.getElementById('focusBar'); if(!el) return;
  const KEY='wiktorOsFocus';
  try{ const v=localStorage.getItem(KEY); if(v!=null) el.innerHTML=v; }catch(e){}
  let t; el.addEventListener('input',()=>{ clearTimeout(t);
    t=setTimeout(()=>{ try{ localStorage.setItem(KEY, el.innerHTML); }catch(e){} },250); });
})();
