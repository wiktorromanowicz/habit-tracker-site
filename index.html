<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex · Habits</title>
<style>
  :root{
    --bg:#f7f6f2; --panel:#ffffff; --panel2:#f3efe4; --line:#e7e2d6;
    --text:#2b2a26; --muted:#8c8474; --accent:#16a34a; --accent-dim:#dcfce7;
    --today:#a9741f;
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:28px;min-height:100vh;overflow-x:hidden;}
  .wrap{max-width:860px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.2px;}
  .weekbar{display:flex;align-items:center;gap:10px;margin:18px 0 14px;}
  .weekbar .label{font-size:14px;color:var(--muted);min-width:210px;text-align:center;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;
    background:var(--panel2);color:var(--text);padding:7px 12px;font-size:13px;
    transition:background .15s,transform .05s;}
  button:hover{background:#eceef2;}
  button:active{transform:scale(.97);}
  .ghost{background:transparent;color:var(--muted);padding:7px 10px;}
  .nav{display:flex;gap:6px;margin-bottom:16px;}
  .nav a{text-decoration:none;font-size:13px;font-weight:500;color:var(--muted);
    background:var(--panel2);padding:7px 14px;border-radius:8px;border:1px solid var(--line);}
  .nav a.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  .nav a:not(.active):hover{background:#eceef2;}
  .brand{font-size:15px;font-weight:700;letter-spacing:.3px;margin-bottom:10px;color:var(--text);}
    background:linear-gradient(90deg,#a9741f,#d4a24a);color:#fff;padding:9px 15px;border-radius:10px;
    margin-bottom:14px;box-shadow:0 2px 10px rgba(169,116,31,.30);}
  .ghost:hover{background:#eef0f3;color:var(--text);}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  th,td{padding:0;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
  th:last-child,td:last-child{border-right:none;}
  tr:last-child td{border-bottom:none;}
  thead th{padding:12px 6px;font-size:12px;font-weight:500;color:var(--muted);background:var(--panel2);}
  thead th.today{color:var(--today);}
  th.habit-col,td.habit-col{text-align:left;padding:14px 14px;width:38%;}
  .hname{font-size:14px;font-weight:500;}
  .hmeta{font-size:11px;color:var(--muted);margin-top:3px;}
  .streak{color:var(--accent);}
  td.day{width:8.8%;height:52px;cursor:pointer;position:relative;}
  td.day:hover{background:var(--panel2);}
  .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
    margin:0 auto;display:flex;align-items:center;justify-content:center;
    transition:all .12s;}
  td.done .dot{background:var(--accent);border-color:var(--accent);}
  td.done .dot::after{content:"";width:6px;height:11px;border:solid #0f1115;
    border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-2px);}
  td.future{cursor:default;opacity:.4;}
  td.future:hover{background:transparent;}
  td.today-cell{background:rgba(59,130,246,.07);}
  .habit-actions{display:none;gap:6px;margin-top:8px;}
  td.habit-col:hover .habit-actions{display:flex;}
  .habit-actions button{padding:3px 8px;font-size:11px;background:transparent;color:var(--muted);}
  .habit-actions button:hover{color:var(--text);background:var(--panel2);}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12px;color:var(--muted);}
  .add-row{margin-top:14px;}
  .add-row button{background:var(--accent-dim);color:var(--accent);}
  .add-row button:hover{background:#274d38;}
  .empty{text-align:center;color:var(--muted);padding:40px;font-size:14px;}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:9999;}


  /* ---- Spreadsheet-style habit sheet (full-width month view) ---- */
  .sheet{background:var(--card,var(--card,#fbf9f4));border-top:1px solid var(--line,#e7e2d6);border-bottom:1px solid var(--line,#e7e2d6);
    box-shadow:0 1px 3px rgba(60,50,30,.06);
    position:relative;left:50%;right:50%;width:100vw;margin-left:-50vw;margin-right:-50vw;}
  .sheet-inner{max-width:1500px;margin:0 auto;padding:0 clamp(16px,4vw,40px);}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:22px 0 16px;flex-wrap:wrap;}
  .sheet-eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;color:#a99f8c;text-transform:uppercase;}
  .sheet-title{font-size:28px;font-weight:700;letter-spacing:-.01em;margin-top:2px;color:var(--ink,#2b2a26);}
  .sheet-sub{font-size:12px;color:#9c9484;margin-top:4px;}
  .periodtabs{display:flex;gap:6px;flex-wrap:wrap;}
  .ptab{font-size:13px;font-weight:500;padding:7px 14px;border-radius:20px;border:1px solid var(--line,#e0dacb);
    background:var(--surface,#fff);color:#4a463d;cursor:pointer;}
  .ptab:hover{background:var(--chip,#f3efe4);}
  .ptab.dark{background:#2b2a26;color:#fff;border-color:var(--ink,#2b2a26);}
  .ptab.dark:hover{background:#3a382f;}
  .sheet-scroll{overflow-x:auto;padding-bottom:2px;}
  .sheet table{width:100%;border-collapse:collapse;background:transparent;border:none;border-radius:0;
    table-layout:fixed;min-width:1160px;}
  .sheet thead th{background:var(--chip,#f3efe4);border-bottom:1px solid var(--line,#e2dccd);border-right:1px solid #ece7da;
    padding:7px 2px;font-weight:600;color:#8c8474;}
  .sheet thead th:last-child{border-right:none;}
  .sheet .dnum{display:block;font-size:13px;font-weight:700;color:#6b6355;line-height:1.1;}
  .sheet .dwd{display:block;font-size:9px;font-weight:600;color:#b3ab99;}
  .sheet thead th.today .dnum{color:#b4802a;}
  .sheet th.habit-col,.sheet td.habit-col{text-align:left;padding:12px 16px;width:180px;background:transparent;}
  .sheet th.habit-col{text-transform:uppercase;font-size:11px;letter-spacing:.04em;}
  .sheet tbody td{border-bottom:1px solid var(--chip,#efeadd);border-right:1px solid var(--chip,#f3eee2);}
  .sheet tbody td:last-child{border-right:none;}
  .sheet tbody tr:nth-child(even){background:var(--soft2,#f8f5ee);}
  .sheet tbody tr:hover{background:#f3efe3;}
  .sheet tbody tr:last-child td{border-bottom:none;}
  /* weekends get a hairline, not a fill; today gets a rule, not a wash —
     three stacked tints were fighting each other (and needed !important to settle it) */
  .sheet th.wend .dnum,.sheet th.wend .dwd{color:#bdb4a1;}
  .sheet td.day{height:38px;cursor:pointer;padding:0;}
  .sheet td.day:hover{background:var(--chip2,#ece5d5);}
  .sheet th.today{box-shadow:inset 1px 0 0 #c69a4e, inset -1px 0 0 #c69a4e, inset 0 2px 0 #c69a4e;}
  .sheet td.today-cell{box-shadow:inset 1px 0 0 #e0c48c, inset -1px 0 0 #e0c48c;}
  .sheet tbody tr:last-child td.today-cell{box-shadow:inset 1px 0 0 #e0c48c, inset -1px 0 0 #e0c48c, inset 0 -2px 0 #c69a4e;}
  /* days before the habit existed: not a miss, not clickable, not counted */
  .sheet td.pre{cursor:default;background:repeating-linear-gradient(135deg,transparent,transparent 5px,rgba(160,150,130,.13) 5px,rgba(160,150,130,.13) 6px);}
  .sheet td.pre:hover{background:repeating-linear-gradient(135deg,transparent,transparent 5px,rgba(160,150,130,.13) 5px,rgba(160,150,130,.13) 6px);}
  .sheet td.pre .dot{display:none;}
  /* never break twice — one miss is quiet, a second consecutive miss is the alarm */
  .sheet td.miss2 .dot{border-color:#d98b7a;background:rgba(200,80,55,.13);}
  .risk{display:flex;flex-direction:column;gap:6px;padding:0 0 14px;}
  .risk .rrow{display:flex;align-items:center;gap:9px;font-size:13px;padding:9px 13px;border-radius:10px;
    background:#fdf3ee;border:1px solid #f0d4c6;color:#8a3f28;}
  .risk .rrow.broke{background:#fbeceb;border-color:#eec6c2;color:#8d3630;}
  .risk .rrow b{font-weight:650;}
  .risk .rrow .why{color:#a8705c;}
  .risk .rrow.calm{background:var(--chip,#f3efe4);border-color:var(--line,#e7e2d6);color:#7d7566;}
  .risk .rrow.calm .why{color:#9c9484;}
  .hstat{color:#b0a693;}
  .hstat b{color:#8c8474;font-weight:600;}
  .sheet td.habit-col{position:relative;}
  .hgrip{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:14px;text-align:center;
    color:#cec5b2;cursor:grab;font-size:13px;line-height:1;opacity:0;user-select:none;}
  .sheet tbody tr:hover .hgrip{opacity:1;}
  .hgrip:active{cursor:grabbing;}
  .sheet tbody tr.dragging{opacity:.45;}
  .sheet tbody tr.dropinto td{box-shadow:inset 0 2px 0 #c69a4e;}
  .hidden-wrap{padding:0 0 16px;font-size:13px;}
  .hidden-wrap .hitem{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:9px;
    background:var(--chip,#f3efe4);color:#8c8474;margin-top:6px;}
  .hidden-wrap .hitem b{color:#6b6355;font-weight:600;}
  .hidden-wrap .hitem button{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:14px;
    border:1px solid var(--line,#e0dacb);background:var(--surface,#fff);color:#4a463d;cursor:pointer;}
  .sheet table.d14{min-width:0;}
  .sheet table.d14 td.day{height:46px;}
  .sheet table.d14 th.habit-col,.sheet table.d14 td.habit-col{width:24%;}
  .sheet table.d14 .dot{width:19px;height:19px;}
  .sheet table.d14 td.done .dot::after{width:5px;height:9px;}
  .sheet .hname{font-weight:600;color:var(--ink,#2b2a26);font-size:15px;}
  .sheet .hmeta{color:#a99f8c;font-size:12px;}
  .sheet .dot{width:15px;height:15px;border:1.5px solid #d4ccbb;}
  .sheet td.done .dot::after{width:4px;height:7px;transform:rotate(45deg) translate(-1px,-1px);}
  .sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:13px 0 20px;font-size:13px;color:#9c9484;flex-wrap:wrap;}

</style>

<script>
const KEY = "titan_habits_v1";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

let state = load() || {
  habits: [
    { id: uid(), name: "100 min of marketing", target: "100 min/day", done: {} }
  ]
};

// migrate: ensure done object exists
state.habits.forEach(h => h.done = h.done || {});
state.goals = state.goals || {};   // { "2026-08": "<html>" }

function firstOfMonth(d){ const x=new Date(d); x.setDate(1); x.setHours(0,0,0,0); return x; }
let trackMonth = firstOfMonth(new Date());
/* 14 days is the default unit — the question you ask each morning is "today?", and a
   31-column grid answers that worst. Month stays a click away for review. */
const VIEW_KEY='apexHabitView';
let view = (function(){ try{ return localStorage.getItem(VIEW_KEY)==='month'?'month':'d14'; }catch(e){ return 'd14'; } })();
let viewEnd = (function(){ const d=new Date(); d.setHours(0,0,0,0); return d; })();
/* every habit knows when it started; days before that are hatched out and never counted
   as misses. Habits from before this existed inherit their earliest tick. */
(function migrateStart(){
  let ch=false;
  (state.habits||[]).forEach(h=>{
    if(h.start!==undefined) return;
    const ks=Object.keys(h.done||{}).sort();
    if(ks.length){ h.start=ks[0]; ch=true; }
  });
  if(ch) save();
})();

function uid(){ return Math.random().toString(36).slice(2,9); }
function mondayOf(d){
  d = new Date(d); const day = (d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-day); return d;
}
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// one-time migration: keys used to be toISOString() of local midnight (UTC date), which is a day early east of UTC
(function(){ if(state.dateKeysLocal) return; const off=new Date(); off.setHours(0,0,0,0); const utcKey=off.toISOString().slice(0,10), localKey=iso(off);
  if(utcKey!==localKey){ state.habits.forEach(h=>{ const nd={}; Object.keys(h.done||{}).forEach(k=>{ const [y,m,d]=k.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d)); // the UTC date the old key came from…
      const local=new Date(dt.getTime()+24*3600*1000); // …was local-midnight minus the offset → add a day back
      nd[iso(local)]=h.done[k]; }); h.done=nd; }); }
  state.dateKeysLocal=true; save(); })();
// one-time correction: ticks made from the Today page (already local dates) before the migration above ran got shifted a day forward.
// A tick can never legitimately sit in the future, and this only runs on 14 Sep 2026 — so anything on/after today moves back a day.
(function(){ if(state.dateKeysFix2) return; const t=new Date(); t.setHours(0,0,0,0); const today=iso(t);
  { state.habits.forEach(h=>{ Object.keys(h.done||{}).filter(k=>k>today || (k===today && today==='2026-09-14')).sort().forEach(k=>{ const [y,m,d]=k.split('-').map(Number); const back=iso(new Date(y,m-1,d-1)); if(!h.done[back]) h.done[back]=h.done[k]; delete h.done[k]; }); }); }
  state.dateKeysFix2=true; save(); })();
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDay(a,b){ return iso(a)===iso(b); }

function shiftPeriod(n){
  if(view==='month'){ trackMonth.setMonth(trackMonth.getMonth()+n); }
  else { viewEnd = addDays(viewEnd, n*14); }
  render();
}
function thisPeriod(){
  trackMonth = firstOfMonth(new Date());
  viewEnd = (function(){ const d=new Date(); d.setHours(0,0,0,0); return d; })();
  render();
}
function toggleView(){
  view = view==='month' ? 'd14' : 'month';
  try{ localStorage.setItem(VIEW_KEY, view); }catch(e){}
  thisPeriod();
}
/* the columns this view covers, oldest first */
function viewDays(){
  if(view==='month'){
    const y=trackMonth.getFullYear(), m=trackMonth.getMonth();
    const n=new Date(y,m+1,0).getDate(), out=[];
    for(let i=1;i<=n;i++) out.push(new Date(y,m,i));
    return out;
  }
  const out=[];
  for(let i=13;i>=0;i--) out.push(addDays(viewEnd,-i));
  return out;
}
function startedBy(h,date){ return !h.start || iso(date) >= h.start; }
/* hidden habits keep all their history — they just stop taking up a row, and stop
   counting towards the percentages and the never-break-twice band */
function liveHabits(){ return state.habits.filter(h=>!h.hidden); }
function hideHabit(hid){ const h=state.habits.find(x=>x.id===hid); if(!h) return; h.hidden=true; save(); render(); }
function unhideHabit(hid){ const h=state.habits.find(x=>x.id===hid); if(!h) return; delete h.hidden; save(); render(); }
let showHidden=false;
function toggleHidden(){ showHidden=!showHidden; render(); }
function renderHidden(){
  const hid=state.habits.filter(h=>h.hidden), btn=document.getElementById('hiddenBtn'), wrap=document.getElementById('hiddenWrap');
  if(!btn||!wrap) return;
  btn.style.display = hid.length ? '' : 'none';
  btn.textContent = (showHidden?'Hide ':'Show ')+hid.length+' hidden';
  wrap.style.display = (hid.length && showHidden) ? '' : 'none';
  wrap.innerHTML = hid.map(h=>'<div class="hitem"><b>'+escapeHtml(h.name)+'</b>'+
    (h.start?'<span>since '+escapeHtml(h.start)+'</span>':'')+
    '<button onclick="unhideHabit(\''+h.id+'\')">Bring back</button></div>').join('');
}
/* longest run of consecutive ticks this habit has ever had */
function bestStreak(h){
  const ks=Object.keys(h.done||{}).filter(k=>h.done[k]).sort();
  let best=0, run=0, prev=null;
  ks.forEach(k=>{
    if(prev && iso(addDays(new Date(prev+'T00:00'),1))===k) run++; else run=1;
    prev=k; if(run>best) best=run;
  });
  return best;
}
/* share of the days it has actually been running, over the last 30 */
function rate30(h){
  const t=new Date(); t.setHours(0,0,0,0);
  let cells=0, hit=0;
  for(let i=0;i<30;i++){ const d=addDays(t,-i); if(!startedBy(h,d)) continue; cells++; if(h.done[iso(d)]) hit++; }
  return {cells, hit, pct: cells? Math.round(hit/cells*100):0};
}
/* how many days in a row have been missed, counting back from yesterday
   (today is still open, so it never counts as a miss) */
function missRun(h){
  const t=new Date(); t.setHours(0,0,0,0);
  let n=0, d=addDays(t,-1);
  while(startedBy(h,d) && !h.done[iso(d)]){ n++; d=addDays(d,-1); if(n>60) break; }
  return n;
}
/* the band above the grid: who is one day from a two-day gap, and who is already in one */
function renderRisk(){
  const t=new Date(); t.setHours(0,0,0,0); const today0=iso(t);
  const rows=[];
  const live=liveHabits();
  live.forEach(h=>{
    if(h.done[today0]) return;                       // already done today — nothing at stake
    const m=missRun(h);
    if(m===1) rows.push({h, cls:'', txt:'missed yesterday — do it today and the gap stays a blip'});
    else if(m>=2) rows.push({h, cls:'broke', txt:'missed '+m+' days running — restart it today, however small'});
  });
  const el=document.getElementById('riskBand');
  if(!el) return;
  if(!live.length){ el.innerHTML=''; return; }
  if(!rows.length){
    el.innerHTML='<div class="rrow calm"><b>Never break twice</b><span class="why">'+
      (live.every(h=>h.done[today0]) ? 'everything ticked today.' : 'nothing has a gap behind it — one miss is fine, two is where habits die.')+'</span></div>';
    return;
  }
  rows.sort((a,b)=>(b.cls?1:0)-(a.cls?1:0));
  el.innerHTML=rows.map(r=>'<div class="rrow '+r.cls+'"><b>'+escapeHtml(r.h.name)+'</b><span class="why">'+r.txt+'</span></div>').join('');
}

function currentStreak(h){
  let s=0, d=new Date(); d.setHours(0,0,0,0);
  // if today not done, start from yesterday so an untouched today doesn't break streak
  if(!h.done[iso(d)]) d = addDays(d,-1);
  while(h.done[iso(d)]){ s++; d = addDays(d,-1); }
  return s;
}

function toggle(hid, dstr, isFuture, ev){ try{ApexUse.log('habit:tick');}catch(e){} 
  if(isFuture) return;
  const h = state.habits.find(x=>x.id===hid);
  if(h.done[dstr]){ delete h.done[dstr]; }
  else { h.done[dstr]=true; fireworks(ev); }
  save(); render();
}

/* ---- fireworks / confetti burst on completion ---- */
const fxCanvas = document.getElementById("fx");
const fxCtx = fxCanvas.getContext("2d");
let fxParts = [], fxRunning = false;
function fxResize(){ fxCanvas.width=innerWidth; fxCanvas.height=innerHeight; }
addEventListener("resize", fxResize); fxResize();

function fireworks(ev){
  let x = innerWidth/2, y = innerHeight/2;
  if(ev){ x = ev.clientX; y = ev.clientY; }
  const colors = ["#4ade80","#3b82f6","#f59e0b","#ef4444","#a855f7","#ec4899","#eab308"];
  const n = 46;
  for(let i=0;i<n;i++){
    const a = (Math.PI*2*i)/n + Math.random()*0.4;
    const sp = 3 + Math.random()*6;
    fxParts.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2,
      life: 1, size: 3+Math.random()*4,
      color: colors[(Math.random()*colors.length)|0],
      rot: Math.random()*6.28, vr:(Math.random()-.5)*.4
    });
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(fxTick); }
}
function fxTick(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  fxParts.forEach(p=>{
    p.vy += 0.15; p.vx *= 0.99; p.x += p.vx; p.y += p.vy;
    p.life -= 0.012; p.rot += p.vr;
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0,p.life);
    fxCtx.translate(p.x,p.y); fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.color;
    fxCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6);
    fxCtx.restore();
  });
  fxParts = fxParts.filter(p=>p.life>0 && p.y<fxCanvas.height+40);
  if(fxParts.length){ requestAnimationFrame(fxTick); }
  else { fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height); fxRunning=false; }
}

async function addHabit(){
  const name = await apexPrompt("Habit name:", "", {ok:"Add habit", placeholder:"e.g. Meditation"});
  if(name===null || !name.trim()) return;
  const target = await apexPrompt("Daily target / note (optional):", "", {ok:"Save", placeholder:"e.g. 10 minutes"});
  if(target===null) return;
  state.habits.push({ id: uid(), name: name.trim(), target: target.trim(), start: iso(new Date()), done:{} });
  save(); render();
}
async function editHabit(hid){
  const h = state.habits.find(x=>x.id===hid); if(!h) return;
  const name = await apexPrompt("Habit name:", h.name, {ok:"Save"}); if(name===null) return;
  const target = await apexPrompt("Daily target / note:", h.target, {ok:"Save"});
  const start = await apexPrompt("Tracking since (YYYY-MM-DD) — earlier days are hatched out and never counted:", h.start||"", {ok:"Save", placeholder:"empty = from the beginning"});
  h.name = name.trim() || h.name;
  if(target!==null) h.target = target.trim();
  if(start!==null){ const v=start.trim(); if(!v) delete h.start; else if(/^\d{4}-\d{2}-\d{2}$/.test(v)) h.start=v; }
  save(); render();
}
function delHabit(hid){
  const h = state.habits.find(x=>x.id===hid);
  if(confirm("Delete \""+h.name+"\" and its history?")){
    state.habits = state.habits.filter(x=>x.id!==hid);
    save(); render();
  }
}

function render(){
  const today = new Date(); today.setHours(0,0,0,0);
  const WD = ["S","M","T","W","T","F","S"];
  const days = viewDays();
  const fmtDay = d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  document.getElementById("weekLabel").textContent = view==='month'
    ? trackMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"})
    : (fmtDay(days[0])+" – "+fmtDay(days[days.length-1]));
  document.getElementById("viewTab").textContent = view==='month' ? '14 days' : 'Month';
  const table = document.querySelector('.sheet table');
  if(table) table.classList.toggle('d14', view!=='month');

  // header — one column per day in view
  let head = '<th class="habit-col">Habit</th>';
  days.forEach(date=>{
    const isT = sameDay(date,today);
    const we = (date.getDay()===0 || date.getDay()===6);
    head += `<th class="${isT?'today':''} ${we?'wend':''}"><span class="dnum">${date.getDate()}</span><span class="dwd">${WD[date.getDay()]}</span></th>`;
  });
  document.getElementById("headRow").innerHTML = head;

  // body
  const body = document.getElementById("body");
  const live = liveHabits();
  if(live.length===0){
    body.innerHTML = `<tr><td colspan="${days.length+1}" class="empty">No habits yet. Click “+ Add habit”.</td></tr>`;
  } else {
    body.innerHTML = live.map(h=>{
      const streak = currentStreak(h);
      const best = bestStreak(h);
      const r30 = rate30(h);
      const bits = [];
      if(h.target) bits.push(escapeHtml(h.target));
      bits.push(streak>0 ? `<span class="streak">🔥 ${streak}d</span>` : `<span class="hstat">no run</span>`);
      if(best>0) bits.push(`<span class="hstat">best <b>${best}d</b></span>`);
      if(r30.cells>=3) bits.push(`<span class="hstat"><b>${r30.pct}%</b> last ${r30.cells===30?"30 days":r30.cells+" days"}</span>`);
      let row = `<td class="habit-col">
        <span class="hgrip" draggable="true" title="Drag to reorder">\u283f</span>
        <div class="hname">${escapeHtml(h.name)}</div>
        <div class="hmeta">${bits.join(" · ")}</div>
        <div class="habit-actions">
          <button onclick="editHabit('${h.id}')">Edit</button>
          <button onclick="hideHabit('${h.id}')">Hide</button>
          <button onclick="delHabit('${h.id}')">Delete</button>
        </div>
      </td>`;
      days.forEach(date=>{
        const dstr = iso(date);
        const future = date>today;
        const pre = !startedBy(h,date);
        const done = !!h.done[dstr];
        const isT = sameDay(date,today);
        const we = (date.getDay()===0 || date.getDay()===6);
        // one miss is quiet; the second in a row is the one worth shouting about
        const prev = addDays(date,-1);
        const miss2 = !done && !future && !pre && !isT
                      && startedBy(h,prev) && !h.done[iso(prev)];
        const cls = `day ${done?'done':''} ${future?'future':''} ${pre?'pre':''} ${miss2?'miss2':''} ${isT?'today-cell':''} ${we?'wend':''}`;
        row += pre
          ? `<td class="${cls}" title="Not tracked yet — started ${escapeHtml(h.start||'')}"></td>`
          : `<td class="${cls}" onclick="toggle('${h.id}','${dstr}',${future},event)"><div class="dot"></div></td>`;
      });
      return `<tr data-id="${h.id}">${row}</tr>`;
    }).join("");
  }

  // period stat — days before a habit started are not counted against it
  let cells=0, filled=0;
  live.forEach(h=>{
    days.forEach(date=>{
      if(date>today || !startedBy(h,date)) return;
      cells++; if(h.done[iso(date)]) filled++;
    });
  });
  renderRisk();
  renderHidden();
  const pct = cells? Math.round(filled/cells*100):0;
  document.getElementById("weekStat").textContent =
    `${view==='month'?'This month':'Last 14 days'}: ${filled}/${cells} done (${pct}%)`;
}

/* drag a row by its grip to reorder — the order is what you see first each morning,
   so it should be yours to set (weakest habit at the top works well) */
(function dragRows(){
  const body=document.getElementById('body'); if(!body) return;
  let dragId=null;
  body.addEventListener('dragstart',e=>{
    const g=e.target.closest&&e.target.closest('.hgrip'); if(!g) return;
    const tr=g.closest('tr'); if(!tr) return;
    dragId=tr.dataset.id; tr.classList.add('dragging');
    try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',dragId); }catch(err){}
  });
  body.addEventListener('dragover',e=>{
    if(!dragId) return; e.preventDefault();
    const tr=e.target.closest&&e.target.closest('tr'); if(!tr||tr.dataset.id===dragId) return;
    body.querySelectorAll('tr.dropinto').forEach(x=>x.classList.remove('dropinto'));
    tr.classList.add('dropinto');
  });
  body.addEventListener('dragleave',e=>{
    const tr=e.target.closest&&e.target.closest('tr'); if(tr) tr.classList.remove('dropinto');
  });
  body.addEventListener('drop',e=>{
    if(!dragId) return; e.preventDefault();
    const tr=e.target.closest&&e.target.closest('tr');
    const overId=tr&&tr.dataset.id;
    body.querySelectorAll('tr.dropinto,tr.dragging').forEach(x=>x.classList.remove('dropinto','dragging'));
    if(overId && overId!==dragId){
      const from=state.habits.findIndex(h=>h.id===dragId);
      const to=state.habits.findIndex(h=>h.id===overId);
      if(from>=0 && to>=0){ const [m]=state.habits.splice(from,1); state.habits.splice(to,0,m); save(); }
    }
    dragId=null; render();
  });
  body.addEventListener('dragend',()=>{
    body.querySelectorAll('tr.dropinto,tr.dragging').forEach(x=>x.classList.remove('dropinto','dragging'));
    dragId=null;
  });
})();
function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function isoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  return 1 + Math.round((d-firstThursday)/(7*86400000));
}
function updateWeekInfo(){
  const now = new Date();
  const endYear = new Date(now.getFullYear(),11,31,23,59,59);
  const weeksLeft = Math.max(0, Math.ceil((endYear-now)/(7*86400000)));
  document.getElementById("weekInfo").textContent =
    `Week ${isoWeek(now)} · ${weeksLeft} weeks left in ${now.getFullYear()}`;
}

render();
updateWeekInfo();
